  /vales:
    get:
      tags: [Vales]
      summary: Listar vales de combustible
      description: |
        Lista paginada de vales de combustible, ordenados por `nro_vale` y `gestion`
        descendente.

        **Siempre** queda restringida a vales pendientes y vigentes (a diferencia de
        `GET /vales/pendientes`, que expone el mismo comportamiento en un formato distinto, este
        endpoint sí acepta filtros adicionales). Esto agrega siempre, sin importar los filtros
        recibidos, las condiciones `estado_vale = PENDIENTE` **y** `fecha_vencimiento >= ahora`.

        Las restricciones de visibilidad dependen del rol del usuario autenticado:
        - **conductor**: solo ve sus propios vales (`id_conductor` = persona del usuario).
        - Otros roles: sin restricción adicional.
      parameters:
        - name: nro_vale
          in: query
          description: |
            Filtra por número de vale. Compara tanto contra `nro_vale` de forma exacta
            como contra la combinación `nro_vale/gestion` (p.ej. `"2/2026"`).
          schema: { type: string }
          example: "2"
        - name: fecha_desde
          in: query
          description: Filtra vales cuya `fecha_emision` sea igual o posterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: fecha_hasta
          in: query
          description: Filtra vales cuya `fecha_emision` sea igual o anterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-31"
        - name: estado_vale
          in: query
          description: |
            Filtra por estado exacto del vale. **En la práctica solo `PENDIENTE` puede devolver
            resultados**: como el endpoint ya restringe siempre a `estado_vale = PENDIENTE` (ver
            arriba), enviar `USADO` o `ANULADO` aquí combina ambas condiciones con `AND` y la
            consulta nunca encuentra coincidencias (lista vacía).
          schema:
            type: string
            enum: [PENDIENTE, USADO, ANULADO]
          example: PENDIENTE
        - name: id_conductor
          in: query
          description: Filtra por conductor. Ignorado para usuarios con rol `conductor`, que siempre quedan restringidos a su propio `id_conductor`.
          schema: { type: integer }
          example: 1
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: |
