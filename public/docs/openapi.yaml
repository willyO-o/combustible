openapi: 3.0.3

info:
  title: API Gestión de Combustible y Flota
  description: |
    API REST para la gestión de operaciones diarias de la flota vehicular, autenticación de usuarios
    y parámetros generales del sistema.

    ## Autenticación

    La mayoría de los endpoints requieren un token **JWT**. Flujo recomendado:

    1. Llamar a `POST /auth/login` con `email` y `password` para obtener un `access_token`.
    2. Enviar dicho token en la cabecera `Authorization: Bearer {access_token}` en cada petición protegida.
    3. Cuando el token esté por expirar, llamar a `POST /auth/refresh` (con el token actual todavía vigente)
       para obtener uno nuevo.
    4. Llamar a `POST /auth/logout` para invalidar el token de forma explícita.

    ## Formato de errores

    - **422 Unprocessable Content**: error de validación. Responde `{ "success": false, "message": "...", "errors": { "campo": ["mensaje"] } }`.
    - **401 Unauthorized**: token ausente, inválido o expirado.
    - **403 Forbidden**: el usuario está autenticado pero no tiene permiso sobre el recurso solicitado.
    - **404 Not Found**: el recurso indicado en la ruta no existe.
    - **500 Internal Server Error**: error inesperado del servidor. Responde `{ "message": "...", "error": "..." }`.

    ## Usuarios de prueba

    Estas cuentas están precargadas en el entorno de pruebas y sirven para probar la
    API con cada rol desde `POST /auth/login`:

    | Rol                   | Email                    | Contraseña      | Alcance / uso principal |
    |-----------------------|--------------------------|-----------------|-------------------------------------|
    | conductor             | conductor@gmail.com      | `conductor123`  | Solo sus propias operaciones |
    | conductor             | conductor2@gmail.com     | `conductor123`  | Solo sus propias operaciones |
    | conductor             | conductor3@gmail.com     | `conductor123`  | Solo sus propias operaciones |
    | jefe-area             | jefearea1@gmail.com      | `jefearea123`   | Solo las operaciones de su área a cargo |
    | jefe-area             | jefearea2@gmail.com      | `jefearea123`   | Solo las operaciones de su área a cargo |
    | jefe-area             | jefearea3@gmail.com      | `jefearea123`   | Solo las operaciones de su área a cargo |
    | tecnico-mantenimiento | tecnico1@gmail.com       | `tecnico123`    | Solo las órdenes de trabajo que tiene asignadas |
    | tecnico-mantenimiento | tecnico2@gmail.com       | `tecnico123`    | Solo las órdenes de trabajo que tiene asignadas |
    | super-admin           | super-admin@gmail.com    | `superadmin123` | Sin restricción |
  version: "1.0.0"
  contact:
    name: Equipo de Desarrollo — Combustible
  license:
    name: Uso interno

servers:
  - url: /api/v1
    description: |
      Servidor actual (relativo al origen desde el que se abre esta documentación).
      Se usa una URL relativa a propósito para que "Try it out" funcione sin
      configuración adicional sin importar el host/puerto real (127.0.0.1:8000,
      localhost, un dominio de Herd/Valet, staging, etc.) — evita que el botón
      "Execute" intente conectarse a un origen distinto al que realmente sirve la API.
  - url: https://{host}/api/v1
    description: Otro entorno accedido por dominio absoluto (staging / producción)
    variables:
      host:
        default: tu-dominio.example.com

tags:
  - name: Autenticación
    description: Login, refresco y cierre de sesión mediante JWT.
  - name: Parámetros
    description: Parámetros generales de la aplicación y catálogos/colecciones de apoyo (vehículos asignados, grifos, tipos de combustible, etc.).
  - name: Operación Diaria
    description: Registro, consulta, actualización y eliminación de las operaciones diarias de los vehículos, incluyendo las actividades realizadas en cada una.
  - name: Vales
    description: Consulta, registro, actualización y eliminación de vales de combustible.
  - name: Carga de Combustible
    description: Registro y consulta de cargas de combustible efectuadas por los conductores, junto con sus respaldos digitales (facturas, notas, comprobantes).
  - name: Control de Cargas
    description: |
      Registro y consulta de cargas de material (viajes de un vehículo externo transportando
      un material) y de los viajes individuales dentro de cada carga. Una carga se abre una
      sola vez y permanece `ABIERTA` mientras se le van agregando viajes; opcionalmente, el
      primer viaje puede registrarse en la misma petición que abre la carga. Incluye también los
      catálogos de materiales transportados (cola, broza, concentrado, etc.) y de vehículos
      externos, ambos consultables y ampliables bajo demanda.
  - name: Solicitudes de Mantenimiento
    description: |
      Paso 1 del flujo de mantenimiento: el conductor (o quien registre en su nombre) reporta
      una solicitud o alarma de mantenimiento preventivo/correctivo para un vehículo. Por ahora
      solo se documentan los endpoints de **listado** y **registro**; el resto del flujo
      (aprobación, orden de trabajo, ejecución) se documentará más adelante, una vez probado.
  - name: Órdenes de Trabajo
    description: |
      Paso 3 del flujo de mantenimiento, visto desde la app móvil del **técnico de
      mantenimiento**: consulta las órdenes de trabajo que le fueron asignadas, **marca el
      inicio** del trabajo, va registrando el detalle del trabajo realizado (repuestos/insumos
      aplicados) **ítem por ítem** a su propio ritmo, y al terminar **marca la orden como
      culminada** con las lecturas finales del vehículo.

      Flujo de estados que maneja el técnico:
      `PENDIENTE` → (`PATCH /ordenes-trabajo/{orden}/iniciar`) → `EN_EJECUCION` →
      (`POST /ordenes-trabajo/{orden}/culminar`) → `CULMINADO`.
      `VERIFICADO` y `CANCELADO` quedan para el emisor de la orden desde el panel web, igual
      que la emisión de la orden (Paso 2). La misma colección de estados y acciones se expone
      en `GET /parametros/colecciones` → `ordenes_trabajo`.
  - name: Notificaciones
    description: |
      Notificaciones de base de datos (`illuminate/notifications`) del usuario autenticado
      (observaciones de operaciones diarias, y las que se vayan añadiendo a futuro).

security:
  - bearerAuth: []

paths:
  # ──────────────────────────────────────────────────────────────────────
  # AUTENTICACIÓN
  # ──────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Autentica al usuario con `email` y `password` y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: conductor@gmail.com
              password: conductor123
              remember: false
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEyLCJpYXQiOjE3NTUxMDAwMDAsImV4cCI6MTc1NTEwMzYwMH0.abc123def456
                token_type: bearer
                expires_in: 3600
                user:
                  name: Conductor User
                  email: conductor@gmail.com
                  nombre_completo: Juan Pérez Quispe
                  nombres: Juan
                  paterno: Pérez
                  materno: Quispe
                  ci: "7451236"
                  f_nacimiento_formatted: 12/05/1990
                  foto_url: http://localhost/storage/usuarios/juan.jpg
                  celular: "70012345"
                  direccion: null
                  roles: [conductor]
                  permisos: [operacion-diaria.ver, operacion-diaria.crear, cargas-combustible.registrar]
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Credenciales incorrectas.
        '422':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Datos de entrada inválidos.
                errors:
                  email: ["El campo email es obligatorio."]
                  password: ["El campo password debe tener al menos 6 caracteres."]

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: Invalida el token JWT actual. Requiere autenticación.
      responses:
        '200':
          description: Sesión cerrada correctamente.
          content:
            application/json:
              example:
                success: true
                message: Sesión cerrada correctamente.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Refrescar token
      description: |
        Genera un nuevo token JWT a partir del token actual (todavía vigente o recientemente
        expirado, según configuración del blacklist). Requiere enviar el token actual en la cabecera
        `Authorization`.
      responses:
        '200':
          description: Token refrescado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: El token expiró y no pudo refrescarse, es inválido, o no se encontró.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expirado:
                  value:
                    success: false
                    message: El token ha expirado y no puede ser refrescado.
                invalido:
                  value:
                    success: false
                    message: Token inválido.
                no_encontrado:
                  value:
                    success: false
                    message: No se encontró el token.

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado
      description: Devuelve los datos combinados de la cuenta autenticada y su persona vinculada (si tiene).
      responses:
        '200':
          description: Datos del usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/UsuarioAutenticado' }
              example:
                success: true
                data:
                  name: Conductor User
                  email: conductor@gmail.com
                  nombre_completo: Juan Pérez Quispe
                  nombres: Juan
                  paterno: Pérez
                  materno: Quispe
                  ci: "7451236"
                  f_nacimiento_formatted: 12/05/1990
                  foto_url: http://localhost/storage/usuarios/juan.jpg
                  celular: "70012345"
                  direccion: "Av. Siempre Viva 123"
                  roles: [conductor]
                  permisos: [operacion-diaria.ver, operacion-diaria.crear, cargas-combustible.registrar]
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Autenticación]
      summary: Actualizar mi perfil
      description: |
        Actualiza los datos editables del perfil de la cuenta autenticada. Es una
        **actualización parcial**: solo se modifican los campos enviados en el
        cuerpo de la petición; los que se omiten conservan su valor actual.

        Solo se pueden actualizar **`name`** (puede usarse como apodo), **`celular`**,
        **`direccion`** y **`foto`** — el correo y la contraseña no se gestionan desde
        este endpoint. `celular`/`direccion` se guardan en la persona vinculada a la
        cuenta (`users.id_persona` -> `persona`): si la cuenta no tiene una persona
        vinculada, esos dos campos simplemente no se actualizan (no se produce
        ningún error). Al reemplazar `foto`, la foto anterior se elimina.

        Acepta tanto `PUT` como `PATCH`.

        ## Envío con foto (`multipart/form-data`)

        Si la petición no incluye `foto`, puede enviarse como `application/json`
        normalmente. Si incluye `foto`, debe enviarse como `multipart/form-data` —
        pero como PHP no procesa el cuerpo de una petición `PUT`/`PATCH` en ese
        formato, la petición debe hacerse como **`POST`** agregando un campo
        `_method=PUT` (o `PATCH`) para que el servidor la trate como tal (la misma
        técnica usada por cualquier formulario que sube archivos a un endpoint que
        no es `POST`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
            example:
              name: Juanito
              celular: "77712345"
              direccion: "Av. Siempre Viva 123"
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
            example:
              _method: PUT
              name: Juanito
              celular: "77712345"
              direccion: "Av. Siempre Viva 123"
      responses:
        '200':
          description: Perfil actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Perfil actualizado exitosamente. }
                  data: { $ref: '#/components/schemas/UsuarioAutenticado' }
              example:
                success: true
                message: Perfil actualizado exitosamente.
                data:
                  name: Juanito
                  email: conductor@gmail.com
                  nombre_completo: Juan Pérez Quispe
                  nombres: Juan
                  paterno: Pérez
                  materno: Quispe
                  ci: "7451236"
                  f_nacimiento_formatted: 12/05/1990
                  foto_url: http://localhost/storage/usuarios/juan.jpg
                  celular: "77712345"
                  direccion: "Av. Siempre Viva 123"
                  roles: [conductor]
                  permisos: [operacion-diaria.ver, operacion-diaria.crear, cargas-combustible.registrar]
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Datos de entrada inválidos.
                errors:
                  celular: ["El campo celular no debe ser mayor que 20 caracteres."]
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Autenticación]
      summary: Actualizar mi perfil (alias de PUT)
      description: |
        Alias de `PUT /auth/me` sobre el mismo recurso, mismo cuerpo y misma
        respuesta — incluyendo el envío con foto (`multipart/form-data` vía
        `POST` con `_method=PATCH`, ver la descripción de `PUT` para el detalle).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Perfil actualizado exitosamente. }
                  data: { $ref: '#/components/schemas/UsuarioAutenticado' }
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────────────────────────────
  # PARÁMETROS
  # ──────────────────────────────────────────────────────────────────────
  /parametros:
    get:
      tags: [Parámetros]
      summary: Parámetros generales de la aplicación
      description: Devuelve información general de configuración de la app (nombre, entorno, url, logo, etc.).
      responses:
        '200':
          description: Parámetros generales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosGenerales'
              example:
                api_version: "1.0"
                app_name: Combustible
                app_env: production
                app_debug: false
                app_url: http://localhost
                timezone: America/La_Paz
                locale: es
                url_logo: http://localhost/images/logo.png
        '401':
          $ref: '#/components/responses/Unauthorized'

  /parametros/colecciones:
    get:
      tags: [Parámetros]
      summary: Colecciones y catálogos de apoyo
      description: |
        Devuelve los catálogos y colecciones necesarios para alimentar formularios del cliente:
        vehículos disponibles para el usuario autenticado, estaciones de servicio activas,
        tipos de combustible activos, los catálogos de materiales y vehículos externos de
        control de cargas, y los valores enumerados usados por otros módulos (cargas de
        combustible, solicitudes de mantenimiento, control de cargas).

        El listado `vehiculos` unifica, sin duplicados, los vehículos que el usuario tiene
        asignados como conductor y todos los vehículos activos de las áreas que administra
        como jefe de área. Un usuario puede tener ambos roles, uno solo o ninguno; si no
        tiene ninguno, `vehiculos` llega vacío. No requiere un registro de conductor.
      responses:
        '200':
          description: Colecciones disponibles para el usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColeccionesResponse'
              example:
                data:
                  vehiculos:
                    - id: 8
                      uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      nro_placa: 1234-ABC
                      codigo: VOLQ-08
                      anio: "2018"
                      marca: Volvo
                      modelo: FMX
                      estado_vehiculo: ACTIVO
                      id_tipo_combustible: 1
                      id_tipo_vehiculo: 3
                      url_fotografia: http://localhost/storage/vehiculos/volq-08.jpg
                      tipo_medicion: kilometraje
                  estaciones_servicio:
                    - id: 1
                      razon_social: Grifo Central YPFB S.R.L.
                      nit: "1023456789"
                      direccion: "Av. 6 de Agosto #123"
                      ciudad: Oruro
                      telefono: "25551234"
                      estado_grifo: ACTIVO
                      es_principal: true
                  tipos_combustible:
                    - id: 1
                      tipo_combustible: Diésel
                      estado_tipo_combustible: ACTIVO
                  cargas_combustible:
                    tipos_carga: [VALE, PREPAGO]
                    tipos_respaldo_digital: [FACTURA, NOTA, COMPROBANTE, OTRO]
                    estado_carga: [REGISTRADO, VERIFICADO, ANULADO]
                  solicitudes_mantenimiento:
                    tipos_mantenimiento: [PREVENTIVO, CORRECTIVO]
                    estado: [PENDIENTE, APROBADA, RECHAZADA, ANULADA]
                  ordenes_trabajo:
                    estados_orden: [PENDIENTE, EN_EJECUCION, CULMINADO, CANCELADO, VERIFICADO]
                    estados:
                      - value: PENDIENTE
                        label: Pendiente
                        descripcion: La orden fue emitida y está a la espera de que el técnico inicie el trabajo.
                      - value: EN_EJECUCION
                        label: En ejecución
                        descripcion: El técnico inició el mantenimiento y está registrando el detalle del trabajo realizado.
                      - value: CULMINADO
                        label: Culminado
                        descripcion: El técnico terminó el trabajo y registró las lecturas finales. El detalle queda congelado.
                      - value: VERIFICADO
                        label: Verificado
                        descripcion: El usuario que emitió la orden validó la ejecución. Estado final.
                      - value: CANCELADO
                        label: Cancelado
                        descripcion: La orden fue anulada y no se ejecutará.
                    acciones_tecnico:
                      - accion: iniciar
                        metodo: PATCH
                        ruta: "ordenes-trabajo/{orden}/iniciar"
                        desde: [PENDIENTE]
                        estado_resultante: EN_EJECUCION
                      - accion: agregar_detalle
                        metodo: POST
                        ruta: "ordenes-trabajo/{orden}/detalles"
                        desde: [PENDIENTE, EN_EJECUCION]
                        estado_resultante: null
                      - accion: eliminar_detalle
                        metodo: DELETE
                        ruta: "ordenes-trabajo/{orden}/detalles/{detalle}"
                        desde: [PENDIENTE, EN_EJECUCION]
                        estado_resultante: null
                      - accion: culminar
                        metodo: POST
                        ruta: "ordenes-trabajo/{orden}/culminar"
                        desde: [EN_EJECUCION]
                        estado_resultante: CULMINADO
                    tipos_mantenimiento:
                      - id: 3
                        tipo_mantenimiento: Cambio de aceite
                    repuestos:
                      - id: 8
                        nombre_repuesto: Filtro de aceite
                        codigo_repuesto: FIL-001
                        unidad_medida: UNIDAD
                        stock_actual: 10
                  control_cargas:
                    materiales:
                      - id: 1
                        material: Cola
                      - id: 2
                        material: Broza
                      - id: 3
                        material: Concentrado
                    vehiculos_externos:
                      - id: 3
                        nro_placa: "148-JLK"
                        propietario: "Transportes Andina"
                    estados_carga: [ABIERTA, CERRADA, PAGADA]
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────────────────────────────
  # OPERACIÓN DIARIA
  # ──────────────────────────────────────────────────────────────────────
  /operacion-diaria:
    get:
      tags: [Operación Diaria]
      summary: Listar operaciones diarias
      description: |
        Lista paginada de operaciones diarias, ordenadas por fecha de creación descendente.

        Las restricciones de visibilidad dependen del rol del usuario autenticado:
        - **conductor**: solo ve sus propias operaciones (`id_conductor` = persona del usuario).
        - **jefe-area**: solo ve las operaciones de las áreas que tiene a su cargo.
        - Otros roles: sin restricción adicional.
      parameters:
        - name: nro_placa
          in: query
          description: Filtra por placa o código del vehículo (coincidencia parcial).
          schema: { type: string }
          example: 1234-ABC
        - name: fecha_desde
          in: query
          description: Filtra operaciones cuya `fecha_inicio` sea igual o posterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: fecha_hasta
          in: query
          description: Filtra operaciones cuya `fecha_inicio` sea igual o anterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-31"
        - name: estado_operacion
          in: query
          description: Filtra por estado exacto de la operación.
          schema:
            type: string
            enum: [PENDIENTE, EN_PROGRESO, FINALIZADO, VERIFICADO, OBSERVADO]
          example: FINALIZADO
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 15
        - name: page
          in: query
          description: |
            Número de página a obtener (paginación estándar del listado, se resuelve
            automáticamente a partir de este parámetro). Si se omite, se asume `1`.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 2
      responses:
        '200':
          description: Listado paginado de operaciones diarias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionDiariaPaginada'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Operación Diaria]
      summary: Registrar una nueva operación diaria
      description: |
        Crea una nueva operación diaria para el vehículo indicado, junto con las actividades
        realizadas durante la jornada.

        El `id_conductor` se asigna automáticamente a partir del usuario autenticado, el
        `nro_operacion` se autogenera de forma correlativa, y `horas_trabajadas` se calcula
        automáticamente a partir de `fecha_inicio` y `fecha_fin`; **ninguno de estos tres debe
        enviarse en el cuerpo de la petición**.

        El `id_area` se determina automáticamente a partir del área actualmente asignada al
        vehículo. Si el vehículo no tiene un área asignada, la petición falla con `422`.

        Reglas condicionales relevantes:
        - Si el vehículo tiene `tipo_medicion = kilometraje`, `kilometraje_inicio` es obligatorio.
        - Si el vehículo tiene `tipo_medicion = horometro`, `horometro_inicio` es obligatorio.
        - `kilometraje_fin` es obligatorio si se envió `kilometraje_inicio`, y debe ser mayor a este.
        - `horometro_fin` es obligatorio si se envió `horometro_inicio`, y debe ser mayor a este.
        - `kilometraje_inicio` / `horometro_inicio` no pueden ser inferiores a la última lectura
          registrada para el vehículo (según el último registro de carga de combustible).
        - Si el vehículo tiene `tipo_medicion = horometro`, cada actividad realizada debe indicar
          `lugar`. Si tiene `tipo_medicion = kilometraje`, cada actividad debe indicar `origen`
          **y** `destino` (p. ej. actividades de transporte).
        - Si se envían `observaciones` y `notificar_observaciones: true`, se envía una notificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperacionDiariaStoreRequest'
            examples:
              con_kilometraje:
                summary: Vehículo medido por kilometraje, con origen/destino
                value:
                  id_vehiculo: 8
                  turno: DIA
                  fecha_inicio: "2026-08-13 07:00"
                  fecha_fin: "2026-08-13 17:00"
                  kilometraje_inicio: 15420.50
                  kilometraje_fin: 15510.00
                  observaciones: "Se detectó ruido leve en el motor al arrancar."
                  notificar_observaciones: true
                  actividades_realizadas:
                    - actividad: Acarreo de material
                      origen: Cancha de acopio
                      destino: Botadero norte
                      cantidad: 6
                      unidad_medida: viajes
                      hora_inicio: "07:15"
                      hora_fin: "11:00"
                    - actividad: Transporte de mineral
                      origen: Cancha de acopio
                      destino: Chancado primario
                      cantidad: 120
                      unidad_medida: m3
                      hora_inicio: "11:30"
                      hora_fin: "16:45"
              con_horometro:
                summary: Vehículo medido por horómetro (p.ej. maquinaria pesada), con lugar
                value:
                  id_vehiculo: 15
                  turno: NOCHE
                  fecha_inicio: "2026-08-13 19:00"
                  fecha_fin: "2026-08-14 06:00"
                  horometro_inicio: 3210.00
                  horometro_fin: 3221.50
                  notificar_observaciones: false
                  actividades_realizadas:
                    - actividad: Nivelación de terreno
                      lugar: Plataforma norte
                      cantidad: 8
                      unidad_medida: horas
                      hora_inicio: "19:30"
                      hora_fin: "03:30"
      responses:
        '201':
          description: Operación diaria creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionDiariaCreateResponse'
              example:
                message: Operación diaria creada exitosamente.
                data:
                  id: 101
                  nro_operacion: 101
                  nro: "00101"
                  id_conductor: 45
                  id_vehiculo: 8
                  id_area: 3
                  turno: DIA
                  fecha_inicio: "13/08/2026 07:00"
                  fecha_fin: "13/08/2026 17:00"
                  fecha_i_f: "2026-08-13 07:00"
                  fecha_f_f: "2026-08-13 17:00"
                  kilometraje_inicio: "15420.50"
                  kilometraje_fin: "15510.00"
                  horometro_inicio: null
                  horometro_fin: null
                  horas_trabajadas: "9.50"
                  id_verificador: null
                  estado: PENDIENTE
                  observaciones: "Se detectó ruido leve en el motor al arrancar."
                  created_at: "13/08/2026 07:05"
                  updated_at: "2026-08-13T07:05:00.000000Z"
                  conductor:
                    id: 45
                    persona:
                      id: 45
                      nombres: Juan
                      paterno: Pérez
                      materno: Quispe
                  vehiculo:
                    id: 8
                    nro_placa: 1234-ABC
                    codigo: VOLQ-08
                    tipo_medicion: kilometraje
                  area:
                    id: 3
