  /cargas-material/{cargaMaterial}/viajes:
    post:
      tags: [Control de Cargas]
      summary: Registrar un viaje (separado) dentro de una carga abierta
      description: |
        Registra un viaje adicional dentro de una carga ya abierta. Se usa tanto para el
        segundo viaje en adelante como para el primero, si no se registró al abrir la carga
        (ver `POST /cargas-material`).

        **Debe enviarse como `multipart/form-data`** (la foto de evidencia es obligatoria).

        `id_usuario_registro` se asigna automáticamente al usuario autenticado y no debe
        enviarse.

        `fecha_hora_carga` se asigna automáticamente a la fecha/hora actual del servidor, salvo
        que `is_offline = true` (uso exclusivo de la app Android, que permite registrar el viaje
        sin conexión y sincronizarlo después): en ese caso `fecha_hora_carga` pasa a ser
        obligatoria y corresponde a la fecha/hora real en que se generó el viaje offline, no a
        la de sincronización.
      parameters:
        - name: cargaMaterial
          in: path
          required: true
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ViajeStoreRequest'
      responses:
        '201':
          description: Viaje registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeStoreResponse'
              example:
                message: Viaje registrado exitosamente.
                data:
                  id: 6
                  id_carga_material: 1
                  id_material: 2
                  id_usuario_registro: 2
                  foto: "control-cargas/viajes/def456.jpg"
                  foto_url: "http://localhost/storage/control-cargas/viajes/def456.jpg"
                  origen: "Cantera Norte"
                  destino: "Planta"
                  detalle: null
                  fecha_hora_carga: "2026-08-24T14:30:00.000000Z"
                  material:
                    id: 2
                    material: Arena
        '422':
          description: |
            Error de validación (formato estándar, ver `DefaultValidationErrorResponse`), **o**
            la carga indicada ya no está `ABIERTA` (en ese caso la respuesta trae únicamente
            `message`, sin `errors`).
          content:
            application/json:
              examples:
                validacion:
                  summary: Error de validación
                  value:
                    message: The given data was invalid.
                    errors:
                      foto: ["La foto de evidencia es obligatoria."]
                      origen: ["El origen es obligatorio."]
                      destino: ["El destino es obligatorio."]
                carga_cerrada:
                  summary: La carga ya no está ABIERTA
                  value:
                    message: "No se pueden registrar viajes: esta carga ya está cerrada."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La carga indicada no existe.
        '500':
          description: Error inesperado al registrar el viaje.
          content:
            application/json:
              example:
                message: Error al registrar el viaje.
                error: "Detalle técnico interno del error (varía según la causa)."

