                  - id: 2
                    nro_vale: 2
                    gestion: 2026
                    fecha_emision: "2026-08-14 21:42"
                    fecha_vencimiento: "2026-08-14 22:42"
                    litros: "30.00"
                    precio: "6.97"
                    id_vehiculo: 1
                    id_conductor: 1
