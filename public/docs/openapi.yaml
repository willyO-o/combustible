  /vales/pendientes:
    get:
      tags: [Vales]
      summary: Listar vales pendientes (formato simplificado, sin paginar)
      description: |
        Devuelve los vales con `estado_vale = PENDIENTE` y `fecha_vencimiento >= ahora`, utilizado
        para el select del vale en la carga del combustible, en un formato aplanado (solo `data`,
        sin las claves adicionales de paginación).

        A diferencia de `GET /vales`, **no acepta ningún filtro de query** (`nro_vale`,
        `fecha_desde`, `fecha_hasta`, `estado_vale`, `id_conductor` son ignorados: siempre
        devuelve el listado completo de vales pendientes vigentes). Las restricciones de
        visibilidad por rol son las mismas que en `GET /vales`:
        - **conductor**: solo ve sus propios vales (`id_conductor` = persona del usuario).

        **Nota:** el campo `grifo` de cada vale devuelto **no** refleja el grifo real del vale
        (`id_grifo`) — actualmente siempre se devuelve el mismo grifo fijo (`id: 3,
        razon_social: "Combustibles Oruro S.R.L.", ciudad: "Oruro"`), sin importar el vale. Se
        documenta tal como se comporta hoy.
      parameters:
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: |
            Número de página a obtener (paginación estándar del listado, se resuelve
            automáticamente a partir de este parámetro). Si se omite, se asume `1`. La
            respuesta no incluye metadatos para saber si existe una página siguiente.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Listado (sin metadatos de paginación) de vales pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValePendienteResponse'
              example:
                data:
                  - id: 2
                    nro_vale: 2
                    nro: "000002/2026"
                    gestion: 2026
                    fecha_emision: "2026-08-14 21:42"
                    fecha_vencimiento: "2026-08-14 22:42"
                    litros: "30.00"
                    precio: "6.97"
                    id_vehiculo: 1
                    id_conductor: 1
                    id_grifo: 2
                    estado_vale: PENDIENTE
                    id_tipo_combustible: 3
                    id_user: 2
                    grifo:
                      id: 3
                      razon_social: Combustibles Oruro S.R.L.
                      ciudad: Oruro
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vales/{vale}/pdf:
    get:
      tags: [Vales]
      summary: Descargar el PDF del vale
      description: |
        Genera y descarga el PDF del vale de combustible (el mismo formato que se imprime
        desde el sistema web), pensado para que la app móvil (Flutter) lo descargue y lo
        muestre en el dispositivo del usuario.

        La respuesta es el archivo binario directo (no JSON): `Content-Type: application/pdf`
        y `Content-Disposition: attachment; filename="vale_NNNNNN-GESTION.pdf"` — el número de
        vale (formato `NNNNNN/GESTION`, p.ej. `000002/2026`) con el `/` cambiado por `-` para
        que sea un nombre de archivo válido (p.ej. `vale_000002-2026.pdf`).

        **Cómo consumirlo desde Flutter:**
        1. Hacer un `GET` a esta URL enviando el header `Authorization: Bearer {access_token}`
           (igual que cualquier otro endpoint autenticado de esta API).
        2. Leer la respuesta como bytes crudos (p.ej. `response.bodyBytes` con `http`, o
           `ResponseType.bytes` con `dio`) — **no** parsear como JSON.
        3. Guardar los bytes en un archivo local (p.ej. con `path_provider`), usando como
           nombre sugerido el que viene en el header `Content-Disposition`.
        4. Abrir el archivo guardado con un visor de PDF nativo del dispositivo (p.ej. el
           paquete `open_filex` / `open_file`), o mostrarlo embebido con un visor de PDF en
           Flutter (p.ej. `flutter_pdfview` / `syncfusion_flutter_pdfviewer`) pasándole los
           bytes o la ruta del archivo guardado.

        **Restricción de acceso:**
        - **conductor**: sólo puede descargar el PDF de sus propios vales
          (`id_conductor` = persona del usuario autenticado); intentar descargar el de otro
          conductor responde `403`.
        - Otros roles: sin restricción adicional.
      parameters:
        - name: vale
          in: path
          required: true
          description: ID del vale.
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: PDF del vale generado exitosamente.
          content:
            application/pdf:
              schema: { type: string, format: binary }
          headers:
            Content-Disposition:
              description: 'Ej: `attachment; filename="vale_000001-2026.pdf"`'
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El conductor autenticado intenta descargar el vale de otro conductor.
          content:
            application/json:
              example:
                message: No tienes permiso para descargar este vale.
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────
  # CARGA DE COMBUSTIBLE
  # ──────────────────────────────────────────────────────────────────────
  /cargas:
    get:
      tags: [Carga de Combustible]
      summary: Listar cargas de combustible
      description: |
        Lista paginada de cargas de combustible, ordenadas por `fecha_carga` e `id` descendente.

        Las restricciones de visibilidad dependen del rol del usuario autenticado:
        - **conductor**: solo ve sus propias cargas (`id_conductor` = persona del usuario).
        - Otros roles: sin restricción adicional.
      parameters:
        - name: nro_placa
          in: query
          description: Filtra por placa o código del vehículo (coincidencia parcial).
          schema: { type: string }
          example: 1234-ABC
        - name: fecha_desde
          in: query
          description: Filtra cargas cuya `fecha_carga` sea igual o posterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: fecha_hasta
          in: query
          description: Filtra cargas cuya `fecha_carga` sea igual o anterior a esta fecha.
          schema: { type: string, format: date }
          example: "2026-08-31"
        - name: tipo_carga
          in: query
          description: Filtra por tipo exacto de carga.
          schema: { type: string, enum: [VALE, PREPAGO] }
          example: PREPAGO
        - name: estado_carga
          in: query
          description: Filtra por estado exacto de la carga.
          schema: { type: string, enum: [REGISTRADO, VERIFICADO, ANULADO] }
          example: REGISTRADO
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: |
            Número de página a obtener (paginación estándar del listado, se resuelve
            automáticamente a partir de este parámetro). Si se omite, se asume `1`.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Listado paginado de cargas de combustible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaCombustiblePaginada'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Carga de Combustible]
      summary: Registrar una nueva carga de combustible
      description: |
        Registra una carga de combustible junto con sus respaldos digitales.

        **Debe enviarse obligatoriamente como `multipart/form-data`** (no `application/json`),
        ya que el campo `respaldos` adjunta uno o más archivos (imagen o PDF) por carga.

        `id_usuario` se asigna automáticamente al usuario autenticado en el servidor y no debe
        enviarse. Lo mismo ocurre con `nro_carga` y `gestion`: correlativo autogenerado dentro
        de la gestión actual (configurable en los parámetros de la empresa; por defecto la
        gestión avanza en diciembre), expuesto en la respuesta de `GET /cargas` como `nro`
        (`nro_carga` formateado con ceros a la izquierda seguido de `/gestion`).

        ## Reglas condicionales relevantes

        - `litros` y `precio` son obligatorios **solo si no se envía `id_vale`**. Si se envía
          `id_vale`, ambos valores se ignoran y se copian automáticamente desde el vale
          referenciado.
        - `kilometraje` es obligatorio si el vehículo indicado (`id_vehiculo`) tiene
          `tipo_medicion = kilometraje`; `horometro` es obligatorio si tiene
          `tipo_medicion = horometro`. En ambos casos, el valor no puede ser inferior a la
          última lectura registrada para ese vehículo.
        - `id_conductor` es obligatorio si el usuario autenticado tiene el rol `conductor`;
          opcional para el resto de roles.
        - Si se envía `id_vale`, debe referenciar un vale con `estado_vale = PENDIENTE`, del
          mismo `id_vehiculo`, y aún no vencido (`fecha_vencimiento > ahora`). Al registrarse la
          carga, ese vale queda marcado como `USADO`.
        - `concepto` ("A utilizarse en") es un texto libre y opcional que describe para qué se
          usará el combustible cargado (ej. "Traslado de personal a planta norte").
        - `is_offline` (uso exclusivo de la app Android, que permite registrar cargas sin
          conexión y sincronizarlas después), si se envía `true`:
          - Omite, solo para esta petición, la exigencia anterior de que `id_vale` siga
            `PENDIENTE` y vigente, ya que para el momento de la sincronización el vale pudo
            haber sido usado o vencido.
          - Hace que `fecha_carga` pase a ser **obligatoria**, ya que en ese caso corresponde
            a la fecha real en que se generó la carga offline (antes de sincronizarse), y no a
            la fecha de sincronización. Si se omite o se envía `false`, `fecha_carga` es
            opcional.

        ## Envío de los respaldos digitales (`respaldos`)

        `respaldos` es un arreglo; cada elemento agrega **dos** campos al `multipart/form-data`,
        con `archivo` (el binario) y `tipo` (texto):

        ```
        respaldos[0][archivo] = (factura.jpg)
        respaldos[0][tipo]    = FACTURA
        respaldos[1][archivo] = (nota.pdf)
        respaldos[1][tipo]    = NOTA
        ```

        Por cada elemento con archivo presente: el tipo de archivo (`IMAGEN` o `PDF`) se
        detecta automáticamente según el archivo recibido, y se guarda asociado con
        `tipo_respaldo` = el `tipo` enviado para ese mismo índice (`OTRO` si se omite). Ver los
        valores válidos de `tipo` en `GET /parametros/colecciones` →
        `cargas_combustible.tipos_respaldo_digital`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargaCombustibleStoreRequest'
      responses:
        '201':
          description: Carga de combustible creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaCombustibleStoreResponse'
              example:
                message: Carga de combustible creada exitosamente
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              example:
                message: The given data was invalid.
                errors:
                  fecha_carga: ["El campo fecha de carga es obligatorio."]
                  id_vehiculo: ["El campo vehículo es obligatorio."]
                  tipo_carga: ["El campo tipo de carga es obligatorio."]
                  kilometraje: ["El kilometraje es obligatorio para vehículos con medición por kilometraje."]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Error inesperado al crear la carga de combustible.
          content:
            application/json:
              example:
                message: Error al crear la carga de combustible.
                error: "Detalle técnico interno del error (varía según la causa)."

  # ──────────────────────────────────────────────────────────────────────
  # CONTROL DE CARGAS
  # ──────────────────────────────────────────────────────────────────────
  /cargas-material:
    get:
      tags: [Control de Cargas]
      summary: Listar cargas de material
      description: |
        Lista paginada de cargas de material, ordenadas por `fecha_apertura` descendente.

        Las restricciones de visibilidad dependen del rol del usuario autenticado:
        - **conductor**: solo ve las cargas que él mismo abrió (`id_usuario_apertura` = usuario
          autenticado), en cualquier estado.
        - Otros roles: ve todas las cargas del sistema, sin restricción adicional.
      parameters:
        - name: estado_carga
          in: query
          description: Filtra por estado exacto de la carga.
          schema: { type: string, enum: [ABIERTA, CERRADA, PAGADA] }
          example: ABIERTA
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: |
            Número de página a obtener (paginación estándar del listado, se resuelve
            automáticamente a partir de este parámetro). Si se omite, se asume `1`.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Listado paginado de cargas de material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaMaterialPaginada'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Control de Cargas]
      summary: Abrir una nueva carga de material (opcionalmente con su primer viaje)
      description: |
        Abre una carga de material para un vehículo externo. La mayoría de los datos se
        asignan automáticamente en el servidor a partir del usuario autenticado y **no deben
        enviarse**:
        - `nro_carga` y `gestion`: correlativo autogenerado dentro de la gestión actual
          (configurable en los parámetros de la empresa; por defecto la gestión avanza en
          diciembre).
        - `estado_carga`: siempre queda en `ABIERTA` al registrar.
        - `id_usuario_apertura`: el usuario autenticado.

        **Debe enviarse como `multipart/form-data`** cuando se registra el primer viaje junto
        con la carga (ver más abajo), ya que ese viaje exige una foto. Si no se registra ningún
        viaje, también puede enviarse como `application/json`.

        ## Reglas condicionales relevantes

        - `pais` es obligatorio **solo si `es_al_exterior = true`**; en caso contrario se ignora
          aunque se envíe.
        - `observaciones` sólo tiene efecto si el usuario autenticado tiene el rol `jefe-area`
          (o `administrador`/`super-admin`): si lo envía un `conductor`, el valor se ignora en
          silencio y la carga queda sin observaciones.
        - `fecha_apertura` se asigna automáticamente a la fecha/hora actual del servidor, salvo
          que `is_offline = true` (uso exclusivo de la app Android, que permite abrir la carga
          sin conexión y sincronizarla después): en ese caso `fecha_apertura` pasa a ser
          **obligatoria** y corresponde a la fecha/hora real en que se abrió la carga offline,
          no a la de sincronización.

        ## Registrar el primer viaje junto con la carga (opcional)

        Si se envía el bloque `viaje` (aunque sea vacío), sus campos internos
        (`viaje[id_material]`, `viaje[foto]`, `viaje[origen]`, `viaje[destino]`) pasan a ser
        **obligatorios** — es decir, el bloque es opcional como un todo, pero si se envía debe
        venir completo. `viaje[detalle]` sigue siendo opcional. Si se omite el bloque `viaje`
        por completo, la carga se abre sin ningún viaje y estos se registran después por
        separado con `POST /cargas-material/{cargaMaterial}/viajes`.

        `viaje[fecha_hora_carga]` sigue el **mismo** `is_offline` de la carga (no tiene uno
        propio): si `is_offline = true`, pasa a ser obligatoria y corresponde a la fecha/hora
        real en que se generó ese primer viaje offline, junto con el resto de la petición. Si
        se omite o es `false`, se asigna automáticamente a la fecha/hora actual del servidor.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargaMaterialStoreRequest'
      responses:
        '201':
          description: Carga de material registrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaMaterialStoreResponse'
              example:
                message: "Carga #000001/2026 registrada exitosamente."
                data:
                  id: 1
                  uuid: "9d1f7e2a-6b3c-4e10-9a3d-2f6b6c1e5a90"
                  nro_carga: 1
                  gestion: "2026"
                  id_vehiculo_externo: 3
                  id_usuario_apertura: 2
                  id_usuario_cierre: null
                  fecha_apertura: "2026-08-24T14:30:00.000000Z"
                  fecha_cierre: null
                  es_al_exterior: false
                  pais: null
                  nombre_conductor: "Juan Externo"
                  telefono: "77712345"
                  fecha_pago: null
                  monto_pago: null
                  detalle: null
                  observaciones: null
                  estado_carga: ABIERTA
                  nro: "000001/2026"
                  created_at: "2026-08-24T14:30:00.000000Z"
                  updated_at: "2026-08-24T14:30:00.000000Z"
                  vehiculo_externo:
                    id: 3
                    nro_placa: "148-JLK"
                    propietario: "Transportes Andina"
                  viajes:
                    - id: 5
                      id_carga_material: 1
                      id_material: 2
                      id_usuario_registro: 2
                      foto: "control-cargas/viajes/abc123.jpg"
                      foto_url: "http://localhost/storage/control-cargas/viajes/abc123.jpg"
                      origen: "Cantera Norte"
                      destino: "Planta"
                      detalle: null
                      fecha_hora_carga: "2026-08-24T14:30:00.000000Z"
                      material:
                        id: 2
                        material: Arena
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              example:
                message: The given data was invalid.
                errors:
                  id_vehiculo_externo: ["Debe seleccionar un vehículo."]
                  pais: ["El país es obligatorio cuando la carga es al exterior."]
                  viaje.foto: ["La foto de evidencia del viaje es obligatoria."]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Error inesperado al registrar la carga.
          content:
            application/json:
              example:
                message: Error al registrar la carga.
                error: "Detalle técnico interno del error (varía según la causa)."

  /cargas-material/{cargaMaterial}:
    get:
      tags: [Control de Cargas]
