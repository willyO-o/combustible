        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Error inesperado al eliminar.
          content:
            application/json:
              example:
                success: false
                message: "Error al eliminar la operación diaria: ..."

  /operacion-actividad/validar:
    post:
      tags: [Operación Diaria]
      summary: Validar los datos de una actividad (antes de agregarla al formulario)
      description: |
        Valida el formato de una actividad realizada de forma independiente, útil para
        interfaces que arman el arreglo `actividades_realizadas` de forma incremental antes de
        enviar el `POST /operacion-diaria` (o `PUT`) definitivo.

        **Importante:** este endpoint **solo valida y devuelve en eco los datos recibidos**
        (`data` = los campos validados, tal cual se enviaron); no persiste nada en la base de
        datos ni agrega la actividad a ninguna operación diaria existente. La responsabilidad de
        acumular las actividades validadas y enviarlas dentro de `actividades_realizadas` recae
        en el cliente.

        **Nota técnica:** aquí la regla `lugar` OR (`origen` **y** `destino`) sí se exige de forma
        estricta (`origen`/`destino` son `required_without:lugar`). Al enviar el mismo elemento
        dentro del arreglo `actividades_realizadas` de `POST`/`PUT /operacion-diaria`, la regla
        equivalente para `origen`/`destino` apunta por error a `actividades_realizadas.*.actividad`
        en vez de a `...*.lugar`; como `actividad` siempre es obligatorio y por tanto siempre está
        presente, esa condición nunca se activa allí — en la práctica, dentro de esas dos rutas
        solo `lugar` queda realmente exigido (a menos que se envíe `origen`), y `destino` nunca es
        forzado por el validador. Es decir: validar una actividad aquí puede ser más estricto que
        enviarla directamente dentro de `actividades_realizadas`. Se documenta tal como se
        comporta hoy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadRealizadaInput'
            example:
              actividad: Acarreo de material
              lugar: Cancha de acopio
              cantidad: 6
              unidad_medida: viajes
              hora_inicio: "07:15"
              hora_fin: "11:00"
      responses:
        '200':
          description: Actividad válida. Se devuelven en eco los datos validados (no se persiste nada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidarActividadResponse'
              example:
                message: Actividad agregada exitosamente.
                data:
                  actividad: Acarreo de material
                  lugar: Cancha de acopio
                  cantidad: 6
                  unidad_medida: viajes
                  hora_inicio: "07:15"
                  hora_fin: "11:00"
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                message: "The actividad field is required."
                errors:
                  actividad: ["The actividad field is required."]
        '401':
          $ref: '#/components/responses/Unauthorized'

