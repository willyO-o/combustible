        - name: nro_placa
          in: query
          description: Filtra por placa (coincidencia parcial).
          schema: { type: string }
          example: "148"
      responses:
        '200':
          description: Catálogo de vehículos externos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehiculoExternoResumen' }
              example:
                data:
                  - id: 3
                    nro_placa: "148-JLK"
                    propietario: "Transportes Andina"
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Control de Cargas]
      summary: Registrar un vehículo externo bajo demanda
      description: |
        Registra un nuevo vehículo externo en el catálogo — pensado para cuando, al abrir una
        carga, el vehículo buscado no existe todavía en `GET /vehiculos-externos` (misma idea
        que el alta rápida del panel web). La placa no puede repetirse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoExternoStoreRequest'
            example:
              nro_placa: "148-JLK"
              propietario: "Transportes Andina"
      responses:
        '201':
          description: Vehículo externo registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiculoExternoStoreResponse'
              example:
                message: Vehículo externo registrado exitosamente.
                data:
                  id: 4
                  nro_placa: "148-JLK"
                  propietario: "Transportes Andina"
        '422':
          description: Error de validación (placa repetida u omitida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              example:
                message: The given data was invalid.
                errors:
                  nro_placa: ["El campo placa ya ha sido registrado."]
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────────────────────────────
  # SOLICITUDES DE MANTENIMIENTO
  # ──────────────────────────────────────────────────────────────────────
  /solicitudes-mantenimiento:
    get:
      tags: [Solicitudes de Mantenimiento]
      summary: Listar solicitudes de mantenimiento
      description: |
        Lista paginada de solicitudes de mantenimiento, ordenadas por `id` descendente.

        Las restricciones de visibilidad dependen del rol del usuario autenticado:
        - **conductor**: solo ve sus propias solicitudes (`id_conductor` = persona del usuario).
        - Otros roles: sin restricción adicional.
      parameters:
        - name: estado
          in: query
          description: Filtra por estado exacto de la solicitud.
          schema: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, ANULADA] }
          example: PENDIENTE
        - name: tipo_mantenimiento
          in: query
          description: Filtra por tipo exacto de mantenimiento.
          schema: { type: string, enum: [PREVENTIVO, CORRECTIVO] }
          example: PREVENTIVO
        - name: id_vehiculo
          in: query
          description: Filtra por vehículo.
          schema: { type: integer }
          example: 1
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: |
            Número de página a obtener (paginación estándar del listado, se resuelve
            automáticamente a partir de este parámetro). Si se omite, se asume `1`.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Listado paginado de solicitudes de mantenimiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudMantenimientoPaginada'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Solicitudes de Mantenimiento]
      summary: Registrar una nueva solicitud de mantenimiento
      description: |
        Registra una nueva solicitud/alarma de mantenimiento para un vehículo (Paso 1 del
        flujo de mantenimiento).

        **Sólo disponible para el rol `conductor`**: cualquier otro rol recibe `403`.

        Se envía como `application/json`. Los siguientes campos se calculan/asignan
        automáticamente en el servidor y **no deben enviarse**:
        - `nro_solicitud` y `gestion`: correlativo autogenerado dentro de la gestión actual
          (si el mes actual es noviembre o diciembre, la gestión ya corresponde al año
          siguiente).
        - `estado`: siempre queda en `PENDIENTE` al registrar.
        - `id_usuario_registra`: el usuario autenticado.
        - `id_conductor`: se asigna siempre a la propia persona del usuario autenticado
          (`id_conductor` = `id_persona` del usuario), sin importar lo que se envíe.
        - `is_offline` (uso exclusivo de la app Android, que permite registrar solicitudes sin
          conexión y sincronizarlas después): si se envía `true`, `fecha_solicitud` pasa a ser
          **obligatoria**, ya que en ese caso corresponde a la fecha real en que se generó la
          solicitud offline (antes de sincronizarse), y no a la fecha de sincronización. Si se
          omite o se envía `false`, `fecha_solicitud` es opcional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudMantenimientoStoreRequest'
            examples:
              en_linea:
                summary: Registro en línea (is_offline omitido/false)
                value:
                  id_vehiculo: "1"
                  tipo_mantenimiento: PREVENTIVO
                  descripcion_problema: hay derrame de aceite
                  kilometraje_actual: "123"
                  horometro_actual: ""
                  observacion: "a sdasdasd asdasdasdasdasd"
              offline:
                summary: Registro sincronizado desde la app offline (is_offline = true)
                value:
                  is_offline: true
                  id_vehiculo: "1"
                  tipo_mantenimiento: PREVENTIVO
                  descripcion_problema: hay derrame de aceite
                  kilometraje_actual: "123"
                  horometro_actual: ""
                  fecha_solicitud: "2026-08-18T00:24"
                  observacion: "a sdasdasd asdasdasdasdasd"
      responses:
        '201':
          description: Solicitud de mantenimiento registrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudMantenimientoStoreResponse'
              example:
                message: Solicitud de mantenimiento registrada exitosamente.
                data:
                  id: 12
                  id_vehiculo: 1
                  nro_solicitud: 12
                  gestion: 2026
                  id_conductor: 1
                  id_usuario_registra: 2
                  tipo_mantenimiento: PREVENTIVO
                  descripcion_problema: hay derrame de aceite
                  kilometraje_actual: 123
                  horometro: null
                  fecha_solicitud: "2026-08-18T00:24:00.000000Z"
                  estado: PENDIENTE
                  observacion: "a sdasdasd asdasdasdasdasd"
                  nro: "000012"
                  fecha: "18/08/2026"
                  created_at: "2026-08-17T14:30:00.000000Z"
                  updated_at: "2026-08-17T14:30:00.000000Z"
                  vehiculo:
                    id: 1
                    nro_placa: 148-JLK
                    codigo: PM-TRA-0001
                    marca: Volvo
                    tipo_medicion: kilometraje
                  conductor:
                    id: 1
                    persona:
                      id: 1
                      nombres: Juan
                      paterno: García
                      materno: López
                  usuarioRegistra:
                    id: 2
                    name: Jefe de Transportes
                    email: jefe@example.com
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              example:
                message: The given data was invalid.
                errors:
                  id_vehiculo: ["Debe seleccionar un vehículo."]
                  tipo_mantenimiento: ["Debe indicar el tipo de mantenimiento."]
                  descripcion_problema: ["La descripción del problema o mantenimiento es obligatoria."]
                  fecha_solicitud: ["La fecha de solicitud es obligatoria."] # solo si is_offline = true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario autenticado no tiene el rol `conductor`.
          content:
            application/json:
              example:
                message: Sólo los conductores pueden registrar solicitudes de mantenimiento.
        '500':
          description: Error inesperado al registrar la solicitud de mantenimiento.
          content:
            application/json:
              example:
                message: Error al registrar la solicitud de mantenimiento.
                error: "Detalle técnico interno del error (varía según la causa)."

  /solicitudes-mantenimiento/{solicitud}/pdf:
    get:
      tags: [Solicitudes de Mantenimiento]
      summary: Descargar el PDF de la solicitud de mantenimiento
      description: |
        Genera y descarga el PDF de la solicitud de mantenimiento (el mismo formato que se
        imprime desde el sistema web), pensado para que la app móvil (Flutter) lo descargue y
        lo muestre en el dispositivo del usuario.

        La respuesta es el archivo binario directo (no JSON): `Content-Type: application/pdf`
        y `Content-Disposition: attachment; filename="solicitud_mantenimiento_NNNNNN-GESTION.pdf"`
        — el número de solicitud (formato `NNNNNN/GESTION`, p.ej. `000012/2026`) con el `/`
        cambiado por `-` para que sea un nombre de archivo válido.

        **Cómo consumirlo desde Flutter:** igual que `GET /vales/{vale}/pdf` (ver esa
        descripción): `GET` autenticado con `Authorization: Bearer {access_token}`, leer la
        respuesta como bytes crudos (no JSON), guardarla en un archivo local y abrirla con un
        visor de PDF nativo o embebido.

        **Restricción de acceso:**
        - **conductor**: sólo puede descargar el PDF de sus propias solicitudes
          (`id_conductor` = persona del usuario autenticado); intentar descargar la de otro
          conductor responde `403`.
        - Otros roles: sin restricción adicional.
      parameters:
        - name: solicitud
          in: path
          required: true
          description: ID de la solicitud de mantenimiento.
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: PDF de la solicitud de mantenimiento generado exitosamente.
          content:
            application/pdf:
              schema: { type: string, format: binary }
          headers:
            Content-Disposition:
              description: 'Ej: `attachment; filename="solicitud_mantenimiento_000012-2026.pdf"`'
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El conductor autenticado intenta descargar la solicitud de otro conductor.
          content:
            application/json:
              example:
                message: No tienes permiso para descargar esta solicitud.
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────
  # ÓRDENES DE TRABAJO
  # ──────────────────────────────────────────────────────────────────────
  /ordenes-trabajo:
    get:
      tags: [Órdenes de Trabajo]
      summary: Listar órdenes de trabajo
      description: |
        Lista paginada de órdenes de trabajo, ordenadas por `id` descendente.

        Visibilidad según el rol del usuario autenticado:
        - **técnico de mantenimiento** (sin además ser jefe de área/administrador): sólo ve las
          órdenes que tiene asignadas (`id_usuario_ejecuta` = usuario autenticado).
        - **jefe de área / administrador / super-admin**: ven todas.

        Cada orden incluye `detalles_count` (cantidad de ítems de detalle ya registrados).
      parameters:
        - name: estado_orden
          in: query
          description: Filtra por estado exacto de la orden.
          schema: { type: string, enum: [PENDIENTE, EN_EJECUCION, CULMINADO, CANCELADO, VERIFICADO] }
          example: EN_EJECUCION
        - name: id_vehiculo
          in: query
          description: Filtra por vehículo.
          schema: { type: integer }
          example: 1
        - name: per_page
          in: query
          description: Cantidad de resultados por página.
          schema: { type: integer, default: 10 }
          example: 10
        - name: page
          in: query
          description: Número de página a obtener. Si se omite, se asume `1`.
          schema: { type: integer, default: 1, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Listado paginado de órdenes de trabajo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajoPaginada'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ordenes-trabajo/{orden}:
    get:
      tags: [Órdenes de Trabajo]
      summary: Ver una orden de trabajo con su detalle
      description: |
        Devuelve la orden de trabajo con el vehículo, la solicitud de origen, el taller (si es
        externa) y **todos los ítems de detalle** ya registrados (`detalles`), cada uno con su
        repuesto y tipo de mantenimiento.

        Un técnico de mantenimiento sólo puede ver las órdenes que tiene asignadas; cualquier
        otra responde `403`.
      parameters:
        - name: orden
          in: path
          required: true
          description: ID de la orden de trabajo.
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: Orden de trabajo con su detalle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OrdenTrabajo' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El técnico autenticado intenta ver una orden que no tiene asignada.
          content:
            application/json:
              example:
                message: No tiene acceso a esta orden de trabajo.
        '404':
          $ref: '#/components/responses/NotFound'

  /ordenes-trabajo/{orden}/iniciar:
    patch:
      tags: [Órdenes de Trabajo]
      summary: Marcar el mantenimiento como iniciado
      description: |
        El técnico marca el inicio del trabajo: la orden pasa de `PENDIENTE` a `EN_EJECUCION`
        y se registra la fecha/hora de ejecución. A partir de aquí puede ir agregando ítems al
        detalle (`POST /ordenes-trabajo/{orden}/detalles`) y, al terminar, culminarla.

        Sin cuerpo. Sólo funciona si la orden está `PENDIENTE`; en cualquier otro estado
        responde `422`. Misma restricción de acceso que el resto de acciones del técnico.
      parameters:
        - name: orden
          in: path
          required: true
          description: ID de la orden de trabajo.
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: Mantenimiento iniciado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Mantenimiento iniciado. }
                  data: { $ref: '#/components/schemas/OrdenTrabajo' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El técnico autenticado intenta iniciar una orden que no tiene asignada.
          content:
            application/json:
              example:
                message: No tiene acceso a esta orden de trabajo.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: La orden no está `PENDIENTE`.
          content:
            application/json:
              example:
                message: Sólo se puede iniciar una orden que está PENDIENTE.

  /ordenes-trabajo/{orden}/culminar:
    post:
      tags: [Órdenes de Trabajo]
      summary: Marcar el mantenimiento como culminado
      description: |
        El técnico cierra la ejecución: la orden pasa de `EN_EJECUCION` a `CULMINADO`, se
        registran las **lecturas finales** del vehículo y una observación opcional, y el
        detalle de trabajo queda **congelado** (ya no admite más ítems ni ediciones).

        Requisitos:
        - La orden debe estar `EN_EJECUCION` (debe haberse iniciado antes); en otro estado
          responde `422`.
        - Debe tener **al menos un ítem** de detalle registrado; si no, responde `422`.

        El campo de lectura final obligatorio depende del `tipo_medicion` del vehículo:
        `kilometraje_actual` si mide por kilometraje, `horometro_actual` si mide por horómetro.

        Misma restricción de acceso que el resto de acciones del técnico.
      parameters:
        - name: orden
          in: path
          required: true
          description: ID de la orden de trabajo.
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenTrabajoCulminarRequest'
            example:
              kilometraje_actual: 85300
              observacion: Se cambió aceite y filtros. Todo en orden.
      responses:
        '200':
          description: Mantenimiento culminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Mantenimiento culminado exitosamente. }
                  data: { $ref: '#/components/schemas/OrdenTrabajo' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El técnico autenticado intenta culminar una orden que no tiene asignada.
          content:
            application/json:
              example:
                message: Sólo puede culminar la ejecución de las órdenes que tiene asignadas.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Error de validación, o la orden no está `EN_EJECUCION`, o no tiene ningún ítem de
            detalle registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              examples:
                validacion:
                  summary: Falta la lectura final
                  value:
                    success: false
                    message: Los datos enviados no son válidos.
                    errors:
                      kilometraje_actual: ["El kilometraje actual es obligatorio."]
                sin_iniciar:
                  summary: La orden no fue iniciada
                  value:
                    message: Sólo se puede culminar una orden que está EN_EJECUCION (primero debe iniciarla).
                sin_detalle:
                  summary: Sin ítems de detalle
                  value:
                    message: Debe registrar al menos un ítem del detalle antes de culminar la orden.

  /ordenes-trabajo/{orden}/detalles:
    post:
      tags: [Órdenes de Trabajo]
      summary: Registrar un ítem del detalle de trabajo
      description: |
        Registra **un** ítem del detalle de trabajo de la orden (un repuesto/insumo aplicado, o
        una acción de mano de obra sin repuesto asociado). El técnico llama a este endpoint cada
        vez que completa una acción: los ítems se agregan de a uno, no hace falta enviarlos
        todos juntos.

        Se envía como `application/json`. `id_orden_trabajo` se toma de la URL y no debe
        enviarse.

        **Restricción de acceso:** un jefe de área/administrador puede registrar el detalle de
        cualquier orden; un técnico de mantenimiento, sólo el de las órdenes que tiene asignadas
        (`id_usuario_ejecuta`). Cualquier otro caso responde `403`.

        El campo de lectura obligatorio (`horometro` **o** `kilometraje`) depende del
        `tipo_medicion` del vehículo de la orden. Sólo se puede registrar detalle mientras la
        orden está `PENDIENTE` o `EN_EJECUCION`; si ya fue culminada/verificada/cancelada
        responde `422`.
      parameters:
        - name: orden
          in: path
          required: true
          description: ID de la orden de trabajo.
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetalleMantenimientoStoreRequest'
            example:
              id_tipo_mantenimiento: 3
              id_repuesto: 8
              fecha: "2026-08-27"
              kilometraje: 85230.5
              cantidad: 2
      responses:
        '201':
          description: Ítem de detalle registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleMantenimientoStoreResponse'
              example:
                message: Detalle de mantenimiento registrado exitosamente.
                data:
                  id: 15
                  id_orden_trabajo: 1
                  id_repuesto: 8
                  id_tipo_mantenimiento: 3
                  fecha: "2026-08-27"
                  horometro: null
                  kilometraje: "85230.50"
                  cantidad: 2
                  created_at: "2026-08-27T14:30:00.000000Z"
                  updated_at: "2026-08-27T14:30:00.000000Z"
                  repuesto:
                    id: 8
                    nombre_repuesto: Filtro de aceite
                    codigo_repuesto: FIL-001
                    unidad_medida: UNIDAD
                  tipo_mantenimiento:
                    id: 3
                    tipo_mantenimiento: Cambio de aceite
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El técnico autenticado intenta registrar detalle en una orden que no tiene asignada.
          content:
            application/json:
              example:
                message: Sólo puede registrar el detalle de las órdenes que tiene asignadas.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Error de validación, o la orden ya no admite cambios en su detalle (estado distinto
            de `PENDIENTE`/`EN_EJECUCION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValidationErrorResponse'
              examples:
                validacion:
                  summary: Error de validación
                  value:
                    success: false
                    message: Los datos enviados no son válidos.
                    errors:
                      id_tipo_mantenimiento: ["Debe indicar el tipo de mantenimiento."]
                      kilometraje: ["El kilometraje es obligatorio."]
                orden_congelada:
                  summary: La orden ya fue culminada
                  value:
                    message: "La orden ya no admite cambios en su detalle de trabajo (sólo mientras está PENDIENTE o EN_EJECUCION)."

  /ordenes-trabajo/{orden}/detalles/{detalle}:
    delete:
      tags: [Órdenes de Trabajo]
      summary: Eliminar un ítem del detalle de trabajo
      description: |
        Elimina un ítem del detalle registrado por error. Sólo mientras la orden está
        `PENDIENTE` o `EN_EJECUCION`; misma restricción de acceso que el registro de detalle.
      parameters:
        - name: orden
          in: path
          required: true
          description: ID de la orden de trabajo.
          schema: { type: integer }
          example: 1
        - name: detalle
          in: path
          required: true
          description: ID del ítem de detalle a eliminar (debe pertenecer a la orden).
          schema: { type: integer }
          example: 15
      responses:
        '200':
          description: Ítem de detalle eliminado exitosamente.
          content:
            application/json:
              example:
                message: Detalle de mantenimiento eliminado exitosamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El técnico autenticado intenta eliminar detalle de una orden que no tiene asignada.
          content:
            application/json:
              example:
                message: No tiene acceso a esta orden de trabajo.
        '404':
          description: La orden o el ítem de detalle no existen, o el ítem no pertenece a esa orden.
        '422':
          description: La orden ya no admite cambios en su detalle (estado distinto de `PENDIENTE`/`EN_EJECUCION`).
          content:
            application/json:
              example:
                message: "La orden ya no admite cambios en su detalle de trabajo (sólo mientras está PENDIENTE o EN_EJECUCION)."

  # ──────────────────────────────────────────────────────────────────────
  # NOTIFICACIONES
  # ──────────────────────────────────────────────────────────────────────
  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar mis notificaciones
      description: |
        Arreglo simple (sin paginar) con las notificaciones disponibles del usuario
        autenticado, ordenadas por fecha de creación descendente. Sólo se devuelven las que
        cumplen **al menos una** de estas condiciones:
        - Aún no fueron leídas (`read_at` es `null`), sin importar su antigüedad.
        - Fueron creadas hace menos de 2 días, aunque ya estén leídas.

        Cada notificación se muestra ya formateada (`titulo`, `descripcion`, `icono`, `url`)
        según su tipo (`data.tipo` en la tabla `notifications`); un tipo sin caso definido cae
        en un formato genérico.
      responses:
        '200':
          description: Notificaciones disponibles del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacion' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notificaciones/{notificacion}/marcar-leida:
    post:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      description: |
        Marca como leída (`read_at`) una notificación del usuario autenticado. Sólo puede
        marcar notificaciones propias: si el `id` pertenece a otro usuario, responde `404`
        (no se filtra su existencia).
      parameters:
        - name: notificacion
          in: path
          required: true
          description: UUID de la notificación (columna `id` de la tabla `notifications`).
          schema: { type: string, format: uuid }
          example: "9d1f7e2a-6b3c-4e10-9a3d-2f6b6c1e5a90"
      responses:
        '200':
          description: Notificación marcada como leída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionMarcarLeidaResponse'
              example:
                message: Notificación marcada como leída.
                data:
                  id: "9d1f7e2a-6b3c-4e10-9a3d-2f6b6c1e5a90"
                  tipo: observacion_operacion
                  titulo: Observación en operación diaria
                  descripcion: Falta revisar presión de llantas
                  icono: ri-error-warning-line
                  url: "http://localhost/operacion-diaria/12"
                  leida: true
                  fecha: "2026-08-17T14:30:00+00:00"
                  fecha_legible: hace 1 día
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido en `POST /auth/login`. Enviar como
        `Authorization: Bearer {access_token}`.

  responses:
    Unauthorized:
      description: No autenticado, token ausente/inválido/expirado.
      content:
        application/json:
          example:
            message: Unauthenticated.
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          example:
            message: "No query results for model [App\\Models\\OperacionDiaria] 999"

  schemas:
    # ── Genéricos ─────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Ha ocurrido un error." }

    ValidationErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Los datos enviados no son válidos." }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            campo: ["mensaje de error"]

    # ── Autenticación ─────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: conductor@gmail.com }
        password: { type: string, format: password, minLength: 6, example: conductor123 }
        remember:
          type: boolean
          default: false
          description: Si es `true`, el token se emite con un TTL extendido (`JWT_REMEMBER_TTL`, por defecto 30 días) en lugar del TTL estándar.
          example: false

    LoginResponse:
      type: object
      properties:
        access_token: { type: string, example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9... }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: Segundos hasta la expiración del token., example: 3600 }
        user: { $ref: '#/components/schemas/UsuarioAutenticado' }

    UsuarioAutenticado:
      type: object
      description: |
        Datos combinados de la cuenta y su persona vinculada, tal como los devuelve
        `POST /auth/login`, `POST /auth/refresh`, `GET /auth/me` y `PUT /auth/me`. Los
        campos que vienen de la persona (de `nombre_completo` en adelante) son `null`
        si la cuenta no tiene una persona vinculada.
      properties:
        name:
          type: string
          description: Nombre de la cuenta. Editable desde `PUT /auth/me` (puede usarse como apodo).
          example: Conductor User
        email: { type: string, format: email, example: conductor@gmail.com }
        nombre_completo: { type: string, nullable: true, example: Juan Pérez Quispe }
        nombres: { type: string, nullable: true, example: Juan }
        paterno: { type: string, nullable: true, example: Pérez }
        materno: { type: string, nullable: true, example: Quispe }
        ci: { type: string, nullable: true, example: "7451236" }
        f_nacimiento_formatted: { type: string, nullable: true, example: 12/05/1990 }
        foto_url: { type: string, nullable: true, example: http://localhost/storage/usuarios/juan.jpg }
        celular:
          type: string
          nullable: true
          description: Editable desde `PUT /auth/me` (se guarda en la persona vinculada).
          example: "70012345"
        direccion:
          type: string
          nullable: true
          description: Editable desde `PUT /auth/me` (se guarda en la persona vinculada).
          example: "Av. Siempre Viva 123"
        roles:
          type: array
          items: { type: string }
          example: [conductor]
        permisos:
          type: array
          items: { type: string }
          example: [operacion-diaria.ver, operacion-diaria.crear]

    ActualizarPerfilRequest:
      type: object
      description: |
        Cuerpo esperado por `PUT`/`PATCH /auth/me`. Es una actualización parcial:
        todos los campos son opcionales y solo se actualizan los que se envían; los
        que se omiten conservan su valor actual.
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre de la cuenta (puede usarse como apodo).
          example: Juanito
        celular:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Se guarda en la persona vinculada a la cuenta (`users.id_persona` ->
            `persona`). Si la cuenta no tiene una persona vinculada, se envía sin
            efecto (no se produce ningún error).
          example: "77712345"
        direccion:
          type: string
          nullable: true
          maxLength: 250
          description: |
            Se guarda en la persona vinculada a la cuenta (`users.id_persona` ->
            `persona`). Si la cuenta no tiene una persona vinculada, se envía sin
            efecto (no se produce ningún error).
          example: "Av. Siempre Viva 123"
        foto:
          type: string
          format: binary
          description: |
            Reemplaza la foto de perfil (la anterior se elimina). Solo válido si la
            petición se envía como `multipart/form-data` (ver la descripción de
            `PUT /auth/me` para el detalle de cómo enviarla).

    # ── Parámetros ────────────────────────────────────────────────────
    ParametrosGenerales:
      type: object
      properties:
        api_version: { type: string, example: "1.0" }
        app_name: { type: string, example: Combustible }
        app_env: { type: string, example: production }
        app_debug: { type: boolean, example: false }
        app_url: { type: string, example: http://localhost }
        timezone: { type: string, example: America/La_Paz }
        locale: { type: string, example: es }
        url_logo: { type: string, example: http://localhost/images/logo.png }

    VehiculoAsignado:
      type: object
      properties:
        id: { type: integer, example: 8 }
        uuid: { type: string, format: uuid, example: 3fa85f64-5717-4562-b3fc-2c963f66afa6 }
        nro_placa: { type: string, example: 1234-ABC }
        codigo: { type: string, nullable: true, example: VOLQ-08 }
        anio: { type: string, nullable: true, example: "2018" }
        marca: { type: string, nullable: true, example: Volvo }
        modelo: { type: string, nullable: true, example: FMX }
        estado_vehiculo: { type: string, enum: [ACTIVO, RETIRADO, VENDIDO], example: ACTIVO }
        id_tipo_combustible: { type: integer, example: 1 }
        id_tipo_vehiculo: { type: integer, example: 3 }
        url_fotografia: { type: string, nullable: true, example: http://localhost/storage/vehiculos/volq-08.jpg }
        tipo_medicion:
          type: string
          enum: [kilometraje, horometro]
          description: Determina si la operación diaria de este vehículo exige kilometraje u horómetro.
          example: kilometraje

    Grifo:
      type: object
      description: Estación de servicio activa. Se devuelve el registro completo tal como está almacenado.
      properties:
        id: { type: integer, example: 1 }
        razon_social: { type: string, example: "Grifo Central YPFB S.R.L." }
        nit: { type: string, nullable: true, example: "1023456789" }
        direccion: { type: string, nullable: true, example: "Av. 6 de Agosto #123" }
        ciudad: { type: string, nullable: true, example: Oruro }
        telefono: { type: string, nullable: true, example: "25551234" }
        estado_grifo: { type: string, enum: [ACTIVO, INACTIVO], example: ACTIVO }
        es_principal: { type: boolean, example: true }

    TipoCombustible:
      type: object
      properties:
        id: { type: integer, example: 1 }
        tipo_combustible: { type: string, example: Diésel }
        estado_tipo_combustible: { type: string, enum: [ACTIVO, INACTIVO], example: ACTIVO }

    ColeccionesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            vehiculos:
              type: array
              items: { $ref: '#/components/schemas/VehiculoAsignado' }
            estaciones_servicio:
              type: array
              items: { $ref: '#/components/schemas/Grifo' }
            tipos_combustible:
              type: array
              items: { $ref: '#/components/schemas/TipoCombustible' }
            cargas_combustible:
              type: object
              properties:
                tipos_carga: { type: array, items: { type: string }, example: [VALE, PREPAGO] }
                tipos_respaldo_digital: { type: array, items: { type: string }, example: [FACTURA, NOTA, COMPROBANTE, OTRO] }
                estado_carga: { type: array, items: { type: string }, example: [REGISTRADO, VERIFICADO, ANULADO] }
            solicitudes_mantenimiento:
              type: object
              properties:
                tipos_mantenimiento: { type: array, items: { type: string }, example: [PREVENTIVO, CORRECTIVO] }
                estado: { type: array, items: { type: string }, example: [PENDIENTE, APROBADA, RECHAZADA, ANULADA] }
            ordenes_trabajo:
              type: object
              description: |
                Catálogos de apoyo para el flujo de ejecución de una orden de trabajo por el
                técnico (ver los endpoints bajo el tag *Órdenes de Trabajo*).
              properties:
                estados_orden:
                  type: array
                  description: Lista simple de todos los estados posibles de una orden.
                  items: { type: string }
                  example: [PENDIENTE, EN_EJECUCION, CULMINADO, CANCELADO, VERIFICADO]
                estados:
                  type: array
                  description: Los mismos estados con etiqueta y descripción para mostrar en la app.
                  items:
                    type: object
                    properties:
                      value: { type: string, example: EN_EJECUCION }
                      label: { type: string, example: En ejecución }
                      descripcion: { type: string, example: "El técnico inició el mantenimiento y está registrando el detalle del trabajo realizado." }
                acciones_tecnico:
                  type: array
                  description: |
                    Acciones que puede realizar el técnico sobre una orden, con el método/ruta,
                    los estados desde los que están permitidas y el estado al que llevan la orden
                    (`null` si no cambia el estado).
                  items:
                    type: object
                    properties:
                      accion: { type: string, example: iniciar }
                      metodo: { type: string, example: PATCH }
                      ruta: { type: string, example: "ordenes-trabajo/{orden}/iniciar" }
                      desde: { type: array, items: { type: string }, example: [PENDIENTE] }
                      estado_resultante: { type: string, nullable: true, example: EN_EJECUCION }
                tipos_mantenimiento:
                  type: array
                  description: Catálogo de tipos de mantenimiento activos y de ámbito `taller` (`id_tipo_mantenimiento` de cada ítem de detalle). Los tipos de ámbito `operacion_diaria` no se incluyen.
                  items:
                    type: object
                    properties:
                      id: { type: integer, example: 3 }
                      tipo_mantenimiento: { type: string, example: Cambio de aceite }
                repuestos:
                  type: array
                  description: Catálogo de repuestos activos (`id_repuesto`, opcional, de cada ítem de detalle).
                  items:
                    type: object
                    properties:
                      id: { type: integer, example: 8 }
                      nombre_repuesto: { type: string, example: Filtro de aceite }
                      codigo_repuesto: { type: string, nullable: true, example: FIL-001 }
                      unidad_medida: { type: string, example: UNIDAD }
                      stock_actual: { type: integer, example: 10 }
            control_cargas:
              type: object
              description: |
                Catálogos de apoyo para el módulo de control de cargas de material (ver
                `POST /cargas-material` y `POST /cargas-material/{cargaMaterial}/viajes`).
              properties:
                materiales:
                  type: array
                  description: |
                    Catálogo completo de materiales transportados en cada viaje (cola, broza,
                    concentrado, etc., según lo que maneje cada operación minera). También se
                    puede consultar/registrar uno nuevo directamente en `GET`/`POST /materiales`.
                  items: { $ref: '#/components/schemas/MaterialResumen' }
                vehiculos_externos:
                  type: array
                  description: |
                    Catálogo completo de vehículos externos (no pertenecen a la flota propia)
                    que transportan material. También se puede consultar/registrar uno nuevo
                    directamente en `GET`/`POST /vehiculos-externos`.
                  items: { $ref: '#/components/schemas/VehiculoExternoResumen' }
                estados_carga:
                  type: array
                  items: { type: string }
                  example: [ABIERTA, CERRADA, PAGADA]

    # ── Operación Diaria ──────────────────────────────────────────────
    ActividadRealizadaInput:
      type: object
      description: |
        Una actividad realizada durante la operación diaria. El campo obligatorio para
        describir el lugar depende del `tipo_medicion` del vehículo (`id_vehiculo`) de la
        operación: `lugar` si es `horometro`, o `origen` **y** `destino` si es `kilometraje`
        (por ejemplo, para actividades de transporte).
      required: [actividad, cantidad, unidad_medida, hora_inicio, hora_fin]
      properties:
        actividad:
          type: string
          minLength: 3
          description: Nombre de la actividad (p.ej. "Acarreo de material").
          example: Acarreo de material
        lugar:
          type: string
          nullable: true
          description: Lugar donde se realizó la actividad. Obligatorio si el vehículo de la operación tiene `tipo_medicion = horometro`.
          example: Cancha de acopio
        origen:
          type: string
          nullable: true
          description: Punto de origen (usado junto con `destino` en actividades de transporte). Obligatorio si el vehículo de la operación tiene `tipo_medicion = kilometraje`.
          example: Cancha de acopio
        destino:
          type: string
          nullable: true
          description: Punto de destino (usado junto con `origen` en actividades de transporte). Obligatorio si el vehículo de la operación tiene `tipo_medicion = kilometraje`.
          example: Chancado primario
        cantidad:
          type: number
          format: float
          minimum: 1
          description: Cantidad realizada, en la unidad indicada por `unidad_medida` (viajes, m3, horas, etc.).
          example: 6
        unidad_medida:
          type: string
          example: viajes
        hora_inicio:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de inicio de la actividad, formato `HH:mm`.
          example: "07:15"
        hora_fin:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de fin de la actividad, formato `HH:mm`.
          example: "11:00"

    MantenimientoOperacionInput:
      type: object
      description: |
        Un control de mantenimiento de operación diaria. `id_tipo_mantenimiento` debe existir
        en `tipo_mantenimiento` y ser de ámbito `operacion_diaria` (los de ámbito `taller` se
        usan en órdenes de trabajo, no aquí). Sólo se registran los controles que traen algún
        dato: `valor` para los tipos de `tipo_valor = cantidad`, o `realizado` para los de
        `tipo_valor = booleano`. Ambos son opcionales y anulables; los que no apliquen a la
        operación se pueden omitir. Cada envío reemplaza por completo el conjunto guardado.
      required: [id_tipo_mantenimiento]
      properties:
        id_tipo_mantenimiento:
          type: integer
          example: 12
        valor:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Valor medido, para los tipos de `tipo_valor = cantidad`.
          example: 12.5
        realizado:
          type: string
          enum: [SI, NO]
          nullable: true
          description: Marca para los tipos de `tipo_valor = booleano`.
          example: SI

    OperacionDiariaStoreRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /operacion-diaria`. `id_conductor`, `id_area`, `nro_operacion`
        y `horas_trabajadas` (calculada a partir de `fecha_inicio`/`fecha_fin`) se calculan en
        el servidor y no deben enviarse.
      required: [id_vehiculo, turno, fecha_inicio, fecha_fin, notificar_observaciones, actividades_realizadas]
      properties:
        id_vehiculo:
          type: integer
          description: Debe existir en la tabla `vehiculo`.
          example: 8
        turno:
          type: string
          enum: [DIA, NOCHE]
          example: DIA
        fecha_inicio:
          type: string
          format: date-time
          example: "2026-08-13 07:00"
        fecha_fin:
          type: string
          format: date-time
          description: Debe ser posterior a `fecha_inicio`.
          example: "2026-08-13 17:00"
        kilometraje_inicio:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si el vehículo tiene `tipo_medicion = kilometraje`. No puede ser menor a la última lectura registrada del vehículo.
          example: 15420.50
        kilometraje_fin:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si se envía `kilometraje_inicio`. Debe ser mayor a `kilometraje_inicio`.
          example: 15510.00
        horometro_inicio:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si el vehículo tiene `tipo_medicion = horometro`. No puede ser menor a la última lectura registrada del vehículo.
          example: null
        horometro_fin:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si se envía `horometro_inicio`. Debe ser mayor a `horometro_inicio`.
          example: null
        observaciones:
          type: string
          nullable: true
          minLength: 10
          example: "Se detectó ruido leve en el motor al arrancar."
        notificar_observaciones:
          type: boolean
          description: Si es `true` y hay `observaciones`, dispara una notificación al área correspondiente.
          example: true
        actividades_realizadas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ActividadRealizadaInput' }
        mantenimientos:
          type: array
          nullable: true
          description: Controles de mantenimiento de operación diaria (opcional). Reemplaza por completo el conjunto guardado.
          items: { $ref: '#/components/schemas/MantenimientoOperacionInput' }

    OperacionDiariaUpdateRequest:
      type: object
      description: |
        Cuerpo esperado por `PUT`/`PATCH /operacion-diaria/{id}`. **No es un parche parcial
        real**: solo se relajan a opcionales los campos `id_vehiculo`, `kilometraje_inicio`,
        `kilometraje_fin`, `horometro_inicio` y `horometro_fin`. El resto — `turno`,
        `fecha_inicio`, `fecha_fin`, `notificar_observaciones` y `actividades_realizadas` —
        sigue siendo **obligatorio**, sin excepción por tratarse de una actualización, y debe
        reenviarse completo en cada petición (incluyendo las actividades que no cambiaron, ya
        que se resincronizan por completo). `horas_trabajadas` se recalcula automáticamente a
        partir de `fecha_inicio`/`fecha_fin` y no debe enviarse.
      required: [turno, fecha_inicio, fecha_fin, notificar_observaciones, actividades_realizadas]
      properties:
        id_vehiculo:
          type: integer
          description: Opcional en la actualización (a diferencia del registro, donde es obligatorio). Si se envía, debe existir en la tabla `vehiculo`.
          example: 8
        turno:
          type: string
          enum: [DIA, NOCHE]
          example: DIA
        fecha_inicio:
          type: string
          format: date-time
          example: "2026-08-13 07:00"
        fecha_fin:
          type: string
          format: date-time
          description: Debe ser posterior a `fecha_inicio`.
          example: "2026-08-13 17:00"
        kilometraje_inicio:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Opcional en la actualización. Si se envía, no puede ser menor a la última lectura registrada del vehículo.
          example: 15420.50
        kilometraje_fin:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Opcional en la actualización. Si se envía, debe ser mayor a `kilometraje_inicio`.
          example: 15525.00
        horometro_inicio:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Opcional en la actualización. Si se envía, no puede ser menor a la última lectura registrada del vehículo.
          example: null
        horometro_fin:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Opcional en la actualización. Si se envía, debe ser mayor a `horometro_inicio`.
          example: null
        observaciones:
          type: string
          nullable: true
          minLength: 10
          example: "Se detectó ruido leve en el motor al arrancar."
        notificar_observaciones:
          type: boolean
          description: Si `observaciones` cambia respecto a su valor original y esto es `true`, dispara una notificación al área correspondiente.
          example: true
        actividades_realizadas:
          type: array
          minItems: 1
          description: Sigue siendo obligatorio en la actualización. Reemplaza por completo el conjunto de actividades existente (no se agrega de forma incremental).
          items: { $ref: '#/components/schemas/ActividadRealizadaInput' }
        mantenimientos:
          type: array
          nullable: true
          description: Controles de mantenimiento de operación diaria (opcional). Reemplaza por completo el conjunto guardado.
          items: { $ref: '#/components/schemas/MantenimientoOperacionInput' }
        estado:
          type: string
          enum: [PENDIENTE, EN_PROGRESO, FINALIZADO, VERIFICADO, OBSERVADO]
          example: FINALIZADO

    ActividadRealizada:
      type: object
      description: Actividad realizada tal como se devuelve en las respuestas (catálogo `actividad` + datos específicos en `pivot`).
      properties:
        id: { type: integer, example: 1 }
        nombre_actividad: { type: string, example: Acarreo de material }
        unidad_medida: { type: string, nullable: true, example: viajes }
        pivot:
          type: object
          properties:
            id: { type: integer, example: 501 }
            origen: { type: string, nullable: true, example: null }
            destino: { type: string, nullable: true, example: null }
            lugar: { type: string, nullable: true, example: Cancha de acopio }
            cantidad: { type: string, example: "6.00" }
            unidad_medida: { type: string, example: viajes }
            hora_inicio: { type: string, example: "07:15" }
            hora_fin: { type: string, example: "11:00" }

    OperacionDiaria:
      type: object
      properties:
        id: { type: integer, example: 101 }
        nro_operacion: { type: integer, description: Correlativo autogenerado., example: 101 }
        nro: { type: string, description: "`nro_operacion` formateado con ceros a la izquierda (5 dígitos).", example: "00101" }
        id_conductor: { type: integer, example: 45 }
        id_vehiculo: { type: integer, example: 8 }
        id_area: { type: integer, example: 3 }
        turno: { type: string, enum: [DIA, NOCHE], example: DIA }
        fecha_inicio: { type: string, description: "Formateada como `d/m/Y H:i`.", example: "13/08/2026 07:00" }
        fecha_fin: { type: string, nullable: true, example: "13/08/2026 17:00" }
        fecha_i_f: { type: string, description: "`fecha_inicio` en formato `Y-m-d H:i` (útil para inputs de formulario).", example: "2026-08-13 07:00" }
        fecha_f_f: { type: string, nullable: true, example: "2026-08-13 17:00" }
        kilometraje_inicio: { type: string, nullable: true, example: "15420.50" }
        kilometraje_fin: { type: string, nullable: true, example: "15510.00" }
        horometro_inicio: { type: string, nullable: true, example: null }
        horometro_fin: { type: string, nullable: true, example: null }
        horas_trabajadas: { type: string, nullable: true, example: "9.50" }
        id_verificador: { type: integer, nullable: true, example: null }
        estado:
          type: string
          enum: [PENDIENTE, EN_PROGRESO, FINALIZADO, VERIFICADO, OBSERVADO]
          example: PENDIENTE
        observaciones: { type: string, nullable: true, example: "Se detectó ruido leve en el motor al arrancar." }
        created_at: { type: string, example: "13/08/2026 07:05" }
        updated_at: { type: string, format: date-time, example: "2026-08-13T07:05:00.000000Z" }
        conductor:
          type: object
          description: Presente cuando la relación fue cargada (`with`/`load`).
          properties:
            id: { type: integer, example: 45 }
            persona:
              type: object
              properties:
                id: { type: integer, example: 45 }
                nombres: { type: string, example: Juan }
                paterno: { type: string, example: Pérez }
                materno: { type: string, example: Quispe }
        vehiculo:
          type: object
          properties:
            id: { type: integer, example: 8 }
            nro_placa: { type: string, example: 1234-ABC }
            codigo: { type: string, nullable: true, example: VOLQ-08 }
            tipo_medicion: { type: string, enum: [kilometraje, horometro], example: kilometraje }
        area:
          type: object
          properties:
            id: { type: integer, example: 3 }
            nombre_area: { type: string, example: Operaciones Mina Norte }
        verificador:
          type: object
          nullable: true
          description: Presente solo en `GET /operacion-diaria/{id}` (no se carga en el listado ni al crear).
        actividadesRealizadas:
          type: array
          items: { $ref: '#/components/schemas/ActividadRealizada' }

    OperacionDiariaCreateResponse:
      type: object
      properties:
        message: { type: string, example: Operación diaria creada exitosamente. }
        data: { $ref: '#/components/schemas/OperacionDiaria' }

    OperacionDiariaUpdateResponse:
      type: object
      properties:
        message: { type: string, example: Operación diaria actualizada exitosamente. }
        data:
          allOf:
            - $ref: '#/components/schemas/OperacionDiaria'
          description: |
            A diferencia de la respuesta de `store`/`show`, aquí normalmente **no** vienen
            presentes las claves `conductor`, `vehiculo`, `area` ni `actividadesRealizadas`.

    ValidarActividadResponse:
      type: object
      description: Eco de los datos validados de `POST /operacion-actividad/validar`. No representa un recurso persistido.
      properties:
        message: { type: string, example: Actividad agregada exitosamente. }
        data: { $ref: '#/components/schemas/ActividadRealizadaInput' }

    OperacionDiariaPaginada:
      type: object
      description: Estructura estándar de paginación.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/OperacionDiaria' }
        first_page_url: { type: string, example: "http://localhost/api/v1/operacion-diaria?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 5 }
        last_page_url: { type: string, example: "http://localhost/api/v1/operacion-diaria?page=5" }
        links:
          type: array
          description: Lista de enlaces de paginación (anterior, cada número de página, siguiente), lista para renderizar controles de paginación.
          items:
            type: object
            properties:
              url: { type: string, nullable: true, example: "http://localhost/api/v1/operacion-diaria?page=2" }
              label: { type: string, example: "2" }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: "http://localhost/api/v1/operacion-diaria?page=2" }
        path: { type: string, example: "http://localhost/api/v1/operacion-diaria" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 10 }
        total: { type: integer, example: 42 }

    # ── Vales ─────────────────────────────────────────────────────────
    ValeVehiculo:
      type: object
      description: Vehículo asociado al vale, tal como se devuelve en el listado (subconjunto de columnas).
      properties:
        id: { type: integer, example: 1 }
        nro_placa: { type: string, example: 148-JLK }
        codigo: { type: string, nullable: true, example: PM-TRA-0001 }
        marca: { type: string, nullable: true, example: Volvo }
        modelo: { type: string, nullable: true, example: null }
        fotografia: { type: string, nullable: true, example: vehiculos/CaPy03xlQuLTZhLkBPlZi0QlXmfDKkDpmwjgd5BS.jpg }
        url_fotografia: { type: string, nullable: true, example: http://localhost:8000/storage/vehiculos/CaPy03xlQuLTZhLkBPlZi0QlXmfDKkDpmwjgd5BS.jpg }

    ValeConductor:
      type: object
      description: Conductor asociado al vale, con su relación `persona` (subconjunto de columnas).
      properties:
        id: { type: integer, example: 1 }
        persona:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombres: { type: string, example: Juan }
            paterno: { type: string, example: García }
            materno: { type: string, nullable: true, example: López }
            ci: { type: string, nullable: true, example: "1234567" }
            foto: { type: string, nullable: true, example: conductores/EmtgAtJKBQlpLmnxjY7W4VLw91eXG4Ct6e97IARI.jpg }
            fecha_nacimiento: { type: string, format: date-time, nullable: true, example: "1990-05-15T04:00:00.000000Z" }
            foto_url: { type: string, nullable: true, example: http://localhost:8000/storage/conductores/EmtgAtJKBQlpLmnxjY7W4VLw91eXG4Ct6e97IARI.jpg }
            edad: { type: integer, nullable: true, description: Calculada a partir de `fecha_nacimiento`., example: 36 }
            f_nacimiento_formatted: { type: string, nullable: true, description: "`fecha_nacimiento` formateada como `d/m/Y`.", example: "15/05/1990" }
            nombre_completo: { type: string, description: "Concatenación de `nombres`, `paterno` y `materno`.", example: Juan García López }

    ValeGrifo:
      type: object
      description: Estación de servicio donde se emitió el vale (subconjunto de columnas).
      properties:
        id: { type: integer, example: 2 }
        razon_social: { type: string, example: Gasolinera Central S.A. }
        ciudad: { type: string, nullable: true, example: La Paz }

    Vale:
      type: object
      properties:
        id: { type: integer, example: 2 }
        nro_vale: { type: integer, description: Correlativo del vale dentro de la gestión., example: 2 }
        gestion: { type: integer, example: 2026 }
        fecha_emision: { type: string, example: "2026-08-14 21:42" }
        fecha_vencimiento: { type: string, nullable: true, example: "2026-08-14 22:42" }
        litros: { type: string, example: "30.00" }
        precio: { type: string, example: "6.97" }
        id_vehiculo: { type: integer, example: 1 }
        id_conductor: { type: integer, example: 1 }
        id_grifo: { type: integer, example: 2 }
        estado_vale:
          type: string
          enum: [PENDIENTE, USADO, ANULADO]
          example: PENDIENTE
        id_tipo_combustible: { type: integer, example: 3 }
        id_user: { type: integer, description: Usuario que registró el vale., example: 2 }
        nro: { type: string, description: "`nro_vale` formateado con ceros a la izquierda (6 dígitos) seguido de `/gestion`.", example: "000002/2026" }
        fecha_emision_f: { type: string, description: "`fecha_emision` formateada como `d/m/Y`.", example: "14/08/2026" }
        fecha_vencimiento_f: { type: string, nullable: true, description: "`fecha_vencimiento` formateada como `d/m/Y`.", example: "14/08/2026" }
        vehiculo: { $ref: '#/components/schemas/ValeVehiculo' }
        conductor: { $ref: '#/components/schemas/ValeConductor' }
        grifo: { $ref: '#/components/schemas/ValeGrifo' }

    ValePaginada:
      type: object
      description: Estructura estándar de paginación, conservando los filtros de query actuales en los links de página.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/Vale' }
        first_page_url: { type: string, example: "http://localhost:8000/api/v1/vales?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string, example: "http://localhost:8000/api/v1/vales?page=1" }
        links:
          type: array
          description: Lista de enlaces de paginación (anterior, cada número de página, siguiente), lista para renderizar controles de paginación.
          items:
            type: object
            properties:
              url: { type: string, nullable: true, example: "http://localhost:8000/api/v1/vales?page=1" }
              label: { type: string, example: "1" }
              page: { type: integer, nullable: true, example: 1 }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: null }
        path: { type: string, example: "http://localhost:8000/api/v1/vales" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 2 }
        total: { type: integer, example: 2 }

    ValePendiente:
      type: object
      description: |
        Representación aplanada de un vale, devuelta únicamente por `GET /vales/pendientes`
        (distinta del recurso `Vale` estándar: sin `fecha_emision_f`/`fecha_vencimiento_f`, y
        con `grifo` fijo — ver la nota técnica del endpoint).
      properties:
        id: { type: integer, example: 2 }
        nro_vale: { type: integer, example: 2 }
        nro: { type: string, description: "`nro_vale` formateado con ceros a la izquierda (6 dígitos) seguido de `/gestion`.", example: "000002/2026" }
        gestion: { type: integer, example: 2026 }
        fecha_emision: { type: string, description: "Formateada como `Y-m-d H:i`.", example: "2026-08-14 21:42" }
        fecha_vencimiento: { type: string, description: "Formateada como `Y-m-d H:i`.", example: "2026-08-14 22:42" }
        litros: { type: string, example: "30.00" }
        precio: { type: string, example: "6.97" }
        id_vehiculo: { type: integer, example: 1 }
        id_conductor: { type: integer, example: 1 }
        id_grifo: { type: integer, description: "Grifo real del vale — no confundir con el objeto `grifo` de esta misma respuesta (ver nota técnica).", example: 2 }
        estado_vale: { type: string, enum: [PENDIENTE], example: PENDIENTE }
        id_tipo_combustible: { type: integer, example: 3 }
        id_user: { type: integer, example: 2 }
        grifo:
          type: object
          description: "**Siempre el mismo valor fijo, sin relación con `id_grifo`** (ver nota técnica del endpoint)."
          properties:
            id: { type: integer, example: 3 }
            razon_social: { type: string, example: Combustibles Oruro S.R.L. }
            ciudad: { type: string, example: Oruro }

    ValePendienteResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ValePendiente' }

    # ── Genéricos de modelo completo (sin restricción de columnas) ──────
    # Usados por Carga de Combustible y Solicitudes de Mantenimiento: a
    # diferencia de `VehiculoAsignado`/`Grifo`/`TipoCombustible`/`ValeConductor`
    # (que sí restringen columnas en su `with()`), estos endpoints cargan las
    # relaciones sin `select` ni `'relacion:col1,col2'`, por lo que devuelven
    # el modelo completo tal cual está en base de datos.
    Vehiculo:
      type: object
      description: Vehículo completo (todas las columnas), a diferencia de `VehiculoAsignado`.
      properties:
        id: { type: integer, example: 8 }
        uuid: { type: string, format: uuid, example: 3fa85f64-5717-4562-b3fc-2c963f66afa6 }
        nro_placa: { type: string, nullable: true, example: 1234-ABC }
        codigo: { type: string, nullable: true, example: VOLQ-08 }
        anio: { type: string, nullable: true, example: "2018" }
        modelo: { type: string, nullable: true, example: FMX }
        marca: { type: string, nullable: true, example: Volvo }
        estado_vehiculo: { type: string, enum: [ACTIVO, RETIRADO, VENDIDO], example: ACTIVO }
        id_tipo_combustible: { type: integer, example: 1 }
        id_tipo_vehiculo: { type: integer, example: 3 }
        fotografia: { type: string, nullable: true, description: Ruta relativa en el disco `public`., example: vehiculos/volq-08.jpg }
        url_fotografia: { type: string, nullable: true, example: http://localhost/storage/vehiculos/volq-08.jpg }
        detalles: { type: string, nullable: true }
        tipo_medicion: { type: string, enum: [kilometraje, horometro], example: kilometraje }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    Persona:
      type: object
      description: Persona completa (todas las columnas), tal como se devuelve dentro de `Conductor`.
      properties:
        id: { type: integer, example: 1 }
        ci: { type: string, example: "1234567" }
        nombres: { type: string, example: Juan }
        paterno: { type: string, nullable: true, example: García }
        materno: { type: string, nullable: true, example: López }
        foto: { type: string, nullable: true, example: conductores/juan.jpg }
        foto_url: { type: string, nullable: true, example: http://localhost/storage/conductores/juan.jpg }
        celular: { type: string, nullable: true, example: "70012345" }
        direccion: { type: string, nullable: true, example: "Av. Siempre Viva" }
        fecha_nacimiento: { type: string, format: date, nullable: true, example: "1990-05-15" }
        estado_persona: { type: string, enum: [ACTIVO, INACTIVO, RETIRADO], example: ACTIVO }
        edad: { type: integer, nullable: true, example: 36 }
        f_nacimiento_formatted: { type: string, nullable: true, example: "15/05/1990" }
        nombre_completo: { type: string, example: Juan García López }
        tipo_actual: { type: string, nullable: true, enum: [conductor, jefe-area, personal], example: conductor }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Conductor:
      type: object
      description: Conductor completo, con su `persona` cargada.
      properties:
        id: { type: integer, description: "Mismo valor que `persona.id` (la tabla `conductor` comparte PK con `persona`).", example: 1 }
        estado_conductor: { type: string, enum: [ACTIVO, INACTIVO, RETIRADO], example: ACTIVO }
        persona: { $ref: '#/components/schemas/Persona' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Usuario:
      type: object
      description: Usuario del sistema (p.ej. quien registró una solicitud u operación).
      properties:
        id: { type: integer, example: 2 }
        name: { type: string, example: Jefe de Transportes }
        email: { type: string, format: email, example: jefe@example.com }
        id_persona: { type: integer, nullable: true, example: 7 }
        estado_usuario: { type: string, enum: [ACTIVO, INACTIVO], example: ACTIVO }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DefaultValidationErrorResponse:
      type: object
      description: |
        Formato **estándar** de error de validación (sin personalizar). A diferencia de
        `ValidationErrorResponse` (usado por algunos endpoints, como el de operación diaria),
        aquí **no** se envuelve con la clave `success`, y el `message` de nivel superior queda
        fijo en inglés (`"The given data was invalid."`) sin traducir. Los mensajes dentro de
        `errors` sí están en español.
      properties:
        message: { type: string, example: "The given data was invalid." }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            campo: ["mensaje de error"]

    # ── Carga de Combustible ─────────────────────────────────────────────
    GrifoCompleto:
      type: object
      description: Grifo/estación de servicio completa, a diferencia de `Grifo` (usado en `colecciones`, con columnas renombradas y restringidas).
      properties:
        id: { type: integer, example: 2 }
        razon_social: { type: string, example: Gasolinera Central S.A. }
        nit: { type: string, example: "1234567890" }
        direccion: { type: string, nullable: true, example: "Av. 6 de Agosto" }
        ciudad: { type: string, nullable: true, example: La Paz }
        telefono: { type: string, nullable: true, example: "22345678" }
        estado_grifo: { type: string, enum: [ACTIVO, INACTIVO], example: ACTIVO }
        es_principal: { type: boolean, example: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TipoCombustibleCompleto:
      type: object
      description: Tipo de combustible completo, a diferencia de `TipoCombustible` (usado en `colecciones`, con columnas renombradas).
      properties:
        id: { type: integer, example: 3 }
        tipo_combustible: { type: string, example: Diésel }
        estado_tipo_combustible: { type: string, enum: [ACTIVO, INACTIVO], example: ACTIVO }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CargaCombustible:
      type: object
      properties:
        id: { type: integer, example: 15 }
        nro_carga: { type: integer, description: Correlativo autogenerado dentro de la gestión., example: 1 }
        gestion: { type: string, example: "2026" }
        nro: { type: string, description: "`nro_carga` formateado con ceros a la izquierda (cantidad de dígitos configurable en los parámetros de la empresa) seguido de `/gestion`.", example: "000001/2026" }
        fecha_carga: { type: string, description: "Formateada como `Y-m-d H:i` por el cast del modelo.", example: "2026-08-17 14:30" }
        litros: { type: string, example: "50.00" }
        precio: { type: string, example: "10.00" }
        kilometraje: { type: string, nullable: true, example: "15600.00" }
        horometro: { type: string, nullable: true, example: null }
        id_vehiculo: { type: integer, example: 8 }
        id_grifo: { type: integer, example: 2 }
        id_tipo_combustible: { type: integer, example: 3 }
        id_conductor: { type: integer, example: 1 }
        id_vale: { type: integer, nullable: true, example: null }
        nro_factura: { type: string, nullable: true, example: "F-00123" }
        concepto: { type: string, nullable: true, description: "\"A utilizarse en\": para qué se usará el combustible cargado.", example: "Traslado de personal a planta norte" }
        tipo_carga: { type: string, enum: [VALE, PREPAGO], example: PREPAGO }
        estado_carga: { type: string, nullable: true, enum: [REGISTRADO, VERIFICADO, ANULADO], example: REGISTRADO }
        id_usuario: { type: integer, nullable: true, description: Usuario que registró la carga (asignado automáticamente al crear)., example: 2 }
        fecha_carga_formateada: { type: string, description: "`fecha_carga` formateada como `d/m/Y H:i`.", example: "17/08/2026 14:30" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        vehiculo: { $ref: '#/components/schemas/Vehiculo' }
        grifo: { $ref: '#/components/schemas/GrifoCompleto' }
        tipoCombustible: { $ref: '#/components/schemas/TipoCombustibleCompleto' }
        conductor: { $ref: '#/components/schemas/Conductor' }
        vale:
          description: |
            Presente solo si la carga se generó a partir de un vale (`id_vale` no nulo). A
            diferencia del recurso `Vale` de `GET /vales`, aquí no vienen cargadas las
            relaciones anidadas del vale (`vehiculo`, `conductor`, `grifo`).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Vale'

    CargaCombustiblePaginada:
      type: object
      description: Estructura estándar de paginación.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/CargaCombustible' }
        first_page_url: { type: string, example: "http://localhost/api/v1/cargas?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string, example: "http://localhost/api/v1/cargas?page=1" }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string, example: "1" }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: null }
        path: { type: string, example: "http://localhost/api/v1/cargas" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 1 }
        total: { type: integer, example: 1 }

    CargaCombustibleStoreRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /cargas`, enviado como `multipart/form-data`. `id_usuario`
        se asigna automáticamente al usuario autenticado y no debe enviarse.
      required: [id_vehiculo, id_grifo, id_tipo_combustible, tipo_carga]
      properties:
        fecha_carga:
          type: string
          format: date-time
          nullable: true
          description: |
            Opcional si `is_offline` se omite o es `false`. **Obligatoria si `is_offline =
            true`** (fecha real en que se generó la carga offline, antes de sincronizarse).
          example: "2026-08-17 14:30"
        litros:
          type: number
          format: float
          nullable: true
          minimum: 0.01
          maximum: 9999.99
          description: Obligatorio si no se envía `id_vale`. Si se envía `id_vale`, este valor se ignora y se toma automáticamente del vale.
          example: 50
        precio:
          type: number
          format: float
          nullable: true
          minimum: 0.01
          maximum: 99999.99
          description: Obligatorio si no se envía `id_vale`. Si se envía `id_vale`, este valor se ignora y se toma automáticamente del vale.
          example: 10
        kilometraje:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si el vehículo (`id_vehiculo`) tiene `tipo_medicion = kilometraje`. No puede ser menor a la última lectura registrada para ese vehículo.
          example: 15600
        horometro:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Obligatorio si el vehículo (`id_vehiculo`) tiene `tipo_medicion = horometro`. No puede ser menor a la última lectura registrada para ese vehículo.
          example: null
        id_vehiculo:
          type: integer
          description: Debe existir en la tabla `vehiculo`.
          example: 8
        id_grifo:
          type: integer
          description: requerido en caso de que no se envíe `id_vale`. Debe existir en la tabla `grifo` y tener `estado_grifo = ACTIVO`.
          example: 2
        id_tipo_combustible:
          type: integer
          description: requerido en caso de que no se envíe `id_vale`. Debe existir en la tabla `tipo_combustible` y tener `estado_tipo_combustible = ACTIVO`.
          example: 3
        id_vale:
          type: integer
          nullable: true
          description: |
            Si se envía, debe referenciar un vale con `estado_vale = PENDIENTE`, del mismo
            `id_vehiculo`, y aún no vencido. Al registrar la carga, el vale queda marcado como
            `USADO` y sus `litros`/`precio` se copian a la carga.
          example: null
        nro_factura:
          type: string
          nullable: true
          maxLength: 50
          example: "F-00123"
        concepto:
          type: string
          nullable: true
          maxLength: 255
          description: "\"A utilizarse en\": describe para qué se usará el combustible cargado."
          example: "Traslado de personal a planta norte"
        tipo_carga:
          type: string
          enum: [VALE, PREPAGO]
          description: Tipo de carga de combustible. Si se envía `VALE`, `id_vale` es obligatorio y `litros`/`precio` se ignoran. Si se envía `PREPAGO`, `id_vale` debe ser nulo y `litros`/`precio` son obligatorios.
          example: PREPAGO
        estado_carga:
          type: string
          nullable: true
          enum: [REGISTRADO, VERIFICADO, ANULADO]
          description: Opcional; si se omite, la carga se crea con estado `REGISTRADO`.
          example: REGISTRADO
        is_offline:
          type: boolean
          nullable: true
          default: false
          description: |
            Uso exclusivo de la app Android (Flutter), que permite registrar cargas de
            combustible sin conexión y sincronizarlas después. Si se envía `true`:
            - Se omite la exigencia de que `id_vale` siga con `estado_vale = PENDIENTE` y
              `fecha_vencimiento` vigente, ya que para el momento en que se sincroniza el vale
              pudo haber sido usado o vencido.
            - `fecha_carga` pasa a ser obligatoria (ver descripción de ese campo).

            No tiene efecto en peticiones fuera de la API (p. ej. el panel web) ni al editar
            una carga sin cambiar su `id_vale`.
          example: false
        respaldos[0][archivo]:
          type: string
          format: binary
          description: |
            Archivo (imagen o PDF) del primer respaldo digital. Repetir incrementando el
            índice (`respaldos[1][archivo]`, `respaldos[2][archivo]`, ...) para adjuntar más de
            un respaldo. El tipo de archivo (`IMAGEN`/`PDF`) se detecta automáticamente por su
            MIME type. hasta 5 archivos. Tamaño máximo por archivo: 2 MB.
        respaldos[0][tipo]:
          type: string
          enum: [FACTURA, NOTA, COMPROBANTE, OTRO]
          default: OTRO
          description: Tipo de respaldo correspondiente a cada `respaldos[0][archivo]`.
          example: FACTURA

    CargaCombustibleStoreResponse:
      type: object
      description: A diferencia de otros endpoints de registro de esta API, aquí la respuesta **no** incluye la carga creada (`data`).
      properties:
        message: { type: string, example: "Carga de combustible creada exitosamente" }

    # ── Control de Cargas ────────────────────────────────────────────────
    VehiculoExternoResumen:
      type: object
      description: Vehículo externo (no pertenece a la flota propia) que transporta un material.
      properties:
        id: { type: integer, example: 3 }
        nro_placa: { type: string, example: "148-JLK" }
        propietario: { type: string, nullable: true, example: "Transportes Andina" }

    MaterialResumen:
      type: object
      properties:
        id: { type: integer, example: 2 }
        material: { type: string, example: Arena }

    Viaje:
      type: object
      description: Una vuelta de carga del material transportado por el vehículo externo, con su foto de evidencia.
      properties:
        id: { type: integer, example: 5 }
        id_carga_material: { type: integer, example: 1 }
        id_material: { type: integer, example: 2 }
        id_usuario_registro: { type: integer, nullable: true, example: 2 }
        foto: { type: string, description: "Ruta interna del archivo (usar `foto_url` para mostrarlo).", example: "control-cargas/viajes/abc123.jpg" }
        foto_url: { type: string, format: uri, example: "http://localhost/storage/control-cargas/viajes/abc123.jpg" }
        origen: { type: string, nullable: true, example: "Cantera Norte" }
        destino: { type: string, nullable: true, example: Planta }
        detalle: { type: string, nullable: true, example: null }
        fecha_hora_carga: { type: string, format: date-time, description: "Fecha/hora en que se generó el viaje. Se asigna automáticamente en el servidor, salvo un registro offline sincronizado desde la app (ver `is_offline` en `ViajeStoreRequest`).", example: "2026-08-17T14:30:00.000000Z" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        material:
          allOf: [{ $ref: '#/components/schemas/MaterialResumen' }]
          nullable: true
        usuarioRegistro:
          allOf: [{ $ref: '#/components/schemas/Usuario' }]
          nullable: true
          description: Sólo presente en `GET /cargas-material/{cargaMaterial}`.

    CargaMaterial:
      type: object
      properties:
        id: { type: integer, example: 1 }
        uuid: { type: string, format: uuid, example: "9d1f7e2a-6b3c-4e10-9a3d-2f6b6c1e5a90" }
        nro_carga: { type: integer, description: Correlativo autogenerado dentro de la gestión., example: 1 }
        gestion: { type: string, description: "Año de gestión. El mes en que la gestión avanza al año siguiente es configurable en los parámetros de la empresa (por defecto diciembre).", example: "2026" }
        id_vehiculo_externo: { type: integer, example: 3 }
        id_usuario_apertura: { type: integer, nullable: true, example: 2 }
        id_usuario_cierre: { type: integer, nullable: true, example: null }
        fecha_apertura: { type: string, format: date-time }
        fecha_cierre: { type: string, format: date-time, nullable: true, example: null }
        es_al_exterior: { type: boolean, example: false }
        pais: { type: string, nullable: true, description: "Sólo tiene valor si `es_al_exterior = true`.", example: null }
        nombre_conductor: { type: string, nullable: true, example: "Juan Externo" }
        telefono: { type: string, nullable: true, example: "77712345" }
        fecha_pago: { type: string, format: date-time, nullable: true, example: null }
        monto_pago: { type: number, format: float, nullable: true, example: null }
        detalle: { type: string, nullable: true, example: null }
        observaciones: { type: string, nullable: true, description: "Sólo puede definirla un usuario con rol `jefe-area` (o `administrador`/`super-admin`); ver `CargaMaterialStoreRequest`.", example: null }
        estado_carga: { type: string, enum: [ABIERTA, CERRADA, PAGADA], example: ABIERTA }
        nro: { type: string, description: "`nro_carga` formateado con ceros a la izquierda (cantidad de dígitos configurable en los parámetros de la empresa) seguido de `/gestion`.", example: "000001/2026" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        vehiculo_externo: { $ref: '#/components/schemas/VehiculoExternoResumen' }
        usuarioApertura:
          allOf: [{ $ref: '#/components/schemas/Usuario' }]
          nullable: true
          description: Sólo presente en `GET /cargas-material/{cargaMaterial}`.
        viajes:
          type: array
          description: Viajes registrados en la carga (vacío justo después de abrirla, salvo que se haya registrado el primero en la misma petición).
          items: { $ref: '#/components/schemas/Viaje' }

    CargaMaterialPaginada:
      type: object
      description: Estructura estándar de paginación.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/CargaMaterial' }
        first_page_url: { type: string, example: "http://localhost/api/v1/cargas-material?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string, example: "http://localhost/api/v1/cargas-material?page=1" }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string, example: "1" }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: null }
        path: { type: string, example: "http://localhost/api/v1/cargas-material" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 1 }
        total: { type: integer, example: 1 }

    CargaMaterialStoreRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /cargas-material`. `nro_carga`, `gestion`, `estado_carga` e
        `id_usuario_apertura` se calculan/asignan en el servidor y no deben enviarse.
      required: [id_vehiculo_externo]
      properties:
        id_vehiculo_externo:
          type: integer
          description: Debe existir en la tabla de vehículos externos.
          example: 3
        nombre_conductor:
          type: string
          nullable: true
          maxLength: 250
          example: "Juan Externo"
        telefono:
          type: string
          nullable: true
          maxLength: 30
          example: "77712345"
        es_al_exterior:
          type: boolean
          nullable: true
          default: false
          description: Indica si la carga sale al exterior (a otro país). Si es `true`, `pais` pasa a ser obligatorio.
          example: false
        pais:
          type: string
          nullable: true
          maxLength: 50
          description: Obligatorio sólo si `es_al_exterior = true`; se ignora en cualquier otro caso.
          example: null
        detalle:
          type: string
          nullable: true
          maxLength: 50
          description: Siempre opcional. A diferencia de `observaciones`, cualquier rol autorizado a abrir la carga puede definirlo.
          example: null
        observaciones:
          type: string
          nullable: true
          description: |
            Sólo tiene efecto si el usuario autenticado tiene el rol `jefe-area` (o
            `administrador`/`super-admin`). Si lo envía un `conductor`, se ignora en silencio y
            la carga queda sin observaciones.
          example: null
        fecha_apertura:
          type: string
          format: date-time
          nullable: true
          description: |
            Opcional si `is_offline` se omite o es `false`. **Obligatoria si `is_offline =
            true`** (fecha/hora real en que se abrió la carga offline, antes de sincronizarse).
          example: "2026-08-17 14:30"
        is_offline:
          type: boolean
          nullable: true
          default: false
          description: |
            Uso exclusivo de la app Android (Flutter), que permite abrir la carga (y,
            opcionalmente, su primer viaje) sin conexión y sincronizarla después. Si se envía
            `true`:
            - `fecha_apertura` pasa a ser obligatoria (ver descripción de ese campo).
            - Si además se envía el bloque `viaje`, `viaje[fecha_hora_carga]` también pasa a ser
              obligatoria — el primer viaje comparte el mismo momento offline que la carga, no
              tiene su propio flag.

            No tiene efecto en peticiones fuera de la API (p. ej. el panel web).
          example: false
        viaje[id_material]:
          type: integer
          description: Obligatorio sólo si se envía el bloque `viaje` (ver descripción del endpoint). Debe existir en la tabla de materiales.
          example: 2
        viaje[foto]:
          type: string
          format: binary
          description: Obligatorio sólo si se envía el bloque `viaje`. Foto de evidencia del viaje. Tamaño máximo 8 MB.
        viaje[origen]:
          type: string
          maxLength: 255
          description: Obligatorio sólo si se envía el bloque `viaje`.
          example: "Cantera Norte"
        viaje[destino]:
          type: string
          maxLength: 255
          description: Obligatorio sólo si se envía el bloque `viaje`.
          example: Planta
        viaje[detalle]:
          type: string
          nullable: true
          maxLength: 255
          description: Siempre opcional, incluso si se envía el bloque `viaje`.
          example: null
        viaje[fecha_hora_carga]:
          type: string
          format: date-time
          nullable: true
          description: |
            No tiene un `is_offline` propio: sigue el mismo `is_offline` de la carga (ver ese
            campo más arriba). Opcional si `is_offline` se omite o es `false`. **Obligatoria si
            `is_offline = true`** (fecha/hora real en que se generó el viaje offline, antes de
            sincronizarse).
          example: "2026-08-17 14:30"

    CargaMaterialStoreResponse:
      type: object
      properties:
        message: { type: string, example: "Carga #000001/2026 registrada exitosamente." }
        data: { $ref: '#/components/schemas/CargaMaterial' }

    ViajeStoreRequest:
      type: object
      description: Cuerpo esperado por `POST /cargas-material/{cargaMaterial}/viajes`. `id_usuario_registro` se asigna automáticamente al usuario autenticado y no debe enviarse.
      required: [id_material, foto, origen, destino]
      properties:
        id_material:
          type: integer
          description: Debe existir en la tabla de materiales.
          example: 2
        foto:
          type: string
          format: binary
          description: Foto de evidencia del viaje. Tamaño máximo 8 MB.
        origen:
          type: string
          maxLength: 255
          example: "Cantera Norte"
        destino:
          type: string
          maxLength: 255
          example: Planta
        detalle:
          type: string
          nullable: true
          maxLength: 255
          example: null
        fecha_hora_carga:
          type: string
          format: date-time
          nullable: true
          description: |
            Opcional si `is_offline` se omite o es `false`. **Obligatoria si `is_offline =
            true`** (fecha/hora real en que se generó el viaje offline, antes de
            sincronizarse).
          example: "2026-08-17 14:30"
        is_offline:
          type: boolean
          nullable: true
          default: false
          description: |
            Uso exclusivo de la app Android (Flutter), que permite registrar viajes sin
            conexión y sincronizarlos después. Si se envía `true`, `fecha_hora_carga` pasa a
            ser obligatoria (ver descripción de ese campo). No tiene efecto en peticiones fuera
            de la API (p. ej. el panel web).
          example: false

    ViajeStoreResponse:
      type: object
      properties:
        message: { type: string, example: Viaje registrado exitosamente. }
        data: { $ref: '#/components/schemas/Viaje' }

    MaterialStoreRequest:
      type: object
      description: Cuerpo esperado por `POST /materiales`.
      required: [material]
      properties:
        material:
          type: string
          maxLength: 150
          description: Nombre del material. No puede repetirse (sin distinguir mayúsculas/minúsculas).
          example: Broza

    MaterialStoreResponse:
      type: object
      properties:
        message: { type: string, example: Material registrado exitosamente. }
        data: { $ref: '#/components/schemas/MaterialResumen' }

    VehiculoExternoStoreRequest:
      type: object
      description: Cuerpo esperado por `POST /vehiculos-externos`.
      required: [nro_placa]
      properties:
        nro_placa:
          type: string
          maxLength: 20
          description: Placa del vehículo. No puede repetirse.
          example: "148-JLK"
        propietario:
          type: string
          nullable: true
          maxLength: 250
          example: "Transportes Andina"

    VehiculoExternoStoreResponse:
      type: object
      properties:
        message: { type: string, example: Vehículo externo registrado exitosamente. }
        data: { $ref: '#/components/schemas/VehiculoExternoResumen' }

    # ── Solicitudes de Mantenimiento ─────────────────────────────────────
    SolicitudMantenimiento:
      type: object
      properties:
        id: { type: integer, example: 12 }
        id_vehiculo: { type: integer, example: 1 }
        nro_solicitud: { type: integer, description: Correlativo autogenerado dentro de la gestión., example: 12 }
        gestion: { type: integer, description: "Año de gestión (si la solicitud se registra en noviembre o diciembre, pertenece a la gestión del año siguiente).", example: 2026 }
        id_conductor: { type: integer, nullable: true, example: 1 }
        id_usuario_registra: { type: integer, nullable: true, example: 2 }
        tipo_mantenimiento: { type: string, enum: [PREVENTIVO, CORRECTIVO], example: PREVENTIVO }
        descripcion_problema: { type: string, example: hay derrame de aceite }
        kilometraje_actual: { type: integer, nullable: true, example: 123 }
        horometro:
          type: integer
          nullable: true
          description: |
            Campo presente en la base de datos, pero no soportado actualmente por esta API:
            cualquier valor enviado (p.ej. `horometro_actual`) se descarta y este campo
            siempre viene `null`.
          example: null
        fecha_solicitud: { type: string, format: date-time, example: "2026-08-18T00:24:00.000000Z" }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, ANULADA], example: PENDIENTE }
        observacion: { type: string, nullable: true, example: "a sdasdasd asdasdasdasdasd" }
        nro: { type: string, description: "`nro_solicitud` formateado con ceros a la izquierda (6 dígitos).", example: "000012" }
        fecha: { type: string, description: "`fecha_solicitud` formateada como `d/m/Y`.", example: "18/08/2026" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        vehiculo: { $ref: '#/components/schemas/Vehiculo' }
        conductor:
          allOf: [{ $ref: '#/components/schemas/Conductor' }]
          nullable: true
        usuarioRegistra:
          allOf: [{ $ref: '#/components/schemas/Usuario' }]
          nullable: true
        ordenTrabajo:
          type: object
          nullable: true
          description: |
            Orden de trabajo generada a partir de esta solicitud (Paso 2 del flujo de
            mantenimiento, aún no documentado). Normalmente `null` justo después del registro.

    SolicitudMantenimientoPaginada:
      type: object
      description: Estructura estándar de paginación.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/SolicitudMantenimiento' }
        first_page_url: { type: string, example: "http://localhost/api/v1/solicitudes-mantenimiento?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string, example: "http://localhost/api/v1/solicitudes-mantenimiento?page=1" }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string, example: "1" }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: null }
        path: { type: string, example: "http://localhost/api/v1/solicitudes-mantenimiento" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 1 }
        total: { type: integer, example: 1 }

    SolicitudMantenimientoStoreRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /solicitudes-mantenimiento`. `nro_solicitud`, `gestion` y
        `estado` (siempre `PENDIENTE` al registrar) se calculan en el servidor, e
        `id_usuario_registra` se asigna al usuario autenticado — ninguno de estos debe
        enviarse.
      required: [id_vehiculo, tipo_mantenimiento, descripcion_problema]
      properties:
        is_offline:
          type: boolean
          nullable: true
          default: false
          description: |
            Uso exclusivo de la app Android (Flutter), que permite registrar solicitudes de
            mantenimiento sin conexión y sincronizarlas después. Si se envía `true`,
            `fecha_solicitud` pasa a ser obligatoria (ver descripción de ese campo). No tiene
            efecto en peticiones fuera de la API (p. ej. el panel web).
          example: false
        id_vehiculo:
          type: integer
          description: Debe existir en la tabla `vehiculo`.
          example: 1
        id_conductor:
          type: integer
          nullable: true
          description: |
            Opcional. Si se omite y el usuario autenticado tiene el rol `conductor`, se asigna
            automáticamente su propia persona (`id_conductor` = `id_persona` del usuario).
          example: 1
        tipo_mantenimiento:
          type: string
          enum: [PREVENTIVO, CORRECTIVO]
          example: PREVENTIVO
        descripcion_problema:
          type: string
          maxLength: 1000
          example: hay derrame de aceite
        kilometraje_actual:
          type: integer
          nullable: true
          minimum: 0
          example: 123
        fecha_solicitud:
          type: string
          format: date-time
          nullable: true
          description: |
            Opcional si `is_offline` se omite o es `false`. **Obligatoria si `is_offline =
            true`** (fecha real en que se generó la solicitud offline, antes de sincronizarse).
          example: "2026-08-18T00:24"
        observacion:
          type: string
          nullable: true
          maxLength: 500
          example: "a sdasdasd asdasdasdasdasd"
        horometro_actual:
          type: string
          nullable: true
          description: |
            **No se persiste actualmente.** Se acepta en el cuerpo de la petición (algunos
            clientes lo envían junto con `kilometraje_actual`), pero se descarta
            silenciosamente y no se guarda en base de datos.
          example: ""

    SolicitudMantenimientoStoreResponse:
      type: object
      properties:
        message: { type: string, example: Solicitud de mantenimiento registrada exitosamente. }
        data: { $ref: '#/components/schemas/SolicitudMantenimiento' }

    # ── Órdenes de Trabajo ───────────────────────────────────────────────
    DetalleMantenimiento:
      type: object
      description: Un ítem del detalle de trabajo de una orden — un repuesto/insumo aplicado (o mano de obra sin repuesto) en una fecha puntual, con la lectura del vehículo en ese momento.
      properties:
        id: { type: integer, example: 15 }
        id_orden_trabajo: { type: integer, example: 1 }
        id_repuesto: { type: integer, nullable: true, description: "`null` cuando el ítem es sólo mano de obra.", example: 8 }
        id_tipo_mantenimiento: { type: integer, example: 3 }
        fecha: { type: string, format: date, example: "2026-08-27" }
        horometro: { type: string, nullable: true, description: "Decimal con 2 posiciones. Obligatorio si el vehículo de la orden mide por horómetro.", example: null }
        kilometraje: { type: string, nullable: true, description: "Decimal con 2 posiciones. Obligatorio si el vehículo de la orden mide por kilometraje.", example: "85230.50" }
        cantidad: { type: integer, minimum: 1, example: 2 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        repuesto:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 8 }
            nombre_repuesto: { type: string, example: Filtro de aceite }
            codigo_repuesto: { type: string, nullable: true, example: FIL-001 }
            unidad_medida: { type: string, example: UNIDAD }
        tipo_mantenimiento:
          type: object
          description: Tipo de mantenimiento del catálogo (`tipo_mantenimiento`), no el enum PREVENTIVO/CORRECTIVO de la orden.
          properties:
            id: { type: integer, example: 3 }
            tipo_mantenimiento: { type: string, example: Cambio de aceite }

    OrdenTrabajo:
      type: object
      description: Orden de trabajo (Paso 2/3 del flujo de mantenimiento) con su detalle de trabajo.
      properties:
        id: { type: integer, example: 1 }
        id_solicitud_mantenimiento: { type: integer, nullable: true, example: 12 }
        id_vehiculo: { type: integer, example: 1 }
        id_conductor: { type: integer, nullable: true, example: 1 }
        id_taller: { type: integer, nullable: true, description: "`null` en órdenes internas.", example: null }
        id_usuario_emite: { type: integer, example: 2 }
        id_usuario_ejecuta: { type: integer, description: Técnico de mantenimiento responsable de ejecutar la orden. Se asigna al emitirla., example: 5 }
        nro_orden: { type: integer, example: 1 }
        gestion: { type: string, example: "2026" }
        fecha_emision: { type: string, format: date-time }
        fecha_ejecucion: { type: string, format: date-time, nullable: true }
        fecha_culminacion: { type: string, format: date-time, nullable: true }
        nota_emisor: { type: string, nullable: true, example: Revisar también el sistema de frenos. }
        observacion: { type: string, nullable: true }
        tipo_mantenimiento: { type: string, enum: [PREVENTIVO, CORRECTIVO], example: PREVENTIVO }
        kilometraje_actual: { type: integer, nullable: true, example: 85000 }
        horometro_actual: { type: integer, nullable: true, example: null }
        estado_orden: { type: string, enum: [PENDIENTE, EN_EJECUCION, CULMINADO, CANCELADO, VERIFICADO], example: EN_EJECUCION }
        nro: { type: string, description: "`nro_orden` formateado con ceros a la izquierda + `/gestion`.", example: "000001/2026" }
        tipo_orden: { type: string, enum: [INTERNO, EXTERNO], description: "Derivado: `EXTERNO` si tiene `id_taller`, `INTERNO` si no.", example: INTERNO }
        detalles_count: { type: integer, description: "Sólo en el listado (`GET /ordenes-trabajo`). Cantidad de ítems de detalle registrados.", example: 3 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        vehiculo: { $ref: '#/components/schemas/Vehiculo' }
        solicitudMantenimiento:
          allOf: [{ $ref: '#/components/schemas/SolicitudMantenimiento' }]
          nullable: true
        taller:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 4 }
            razon_social: { type: string, example: Taller Mecánico Central S.R.L. }
        usuarioEmite:
          allOf: [{ $ref: '#/components/schemas/Usuario' }]
          nullable: true
        usuarioEjecuta:
          allOf: [{ $ref: '#/components/schemas/Usuario' }]
          nullable: true
        detalles:
          type: array
          description: "Ítems del detalle de trabajo. Presente en `GET /ordenes-trabajo/{orden}`."
          items: { $ref: '#/components/schemas/DetalleMantenimiento' }

    OrdenTrabajoPaginada:
      type: object
      description: Estructura estándar de paginación.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/OrdenTrabajo' }
        first_page_url: { type: string, example: "http://localhost/api/v1/ordenes-trabajo?page=1" }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string, example: "http://localhost/api/v1/ordenes-trabajo?page=1" }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string, example: "1" }
              active: { type: boolean, example: true }
        next_page_url: { type: string, nullable: true, example: null }
        path: { type: string, example: "http://localhost/api/v1/ordenes-trabajo" }
        per_page: { type: integer, example: 10 }
        prev_page_url: { type: string, nullable: true, example: null }
        to: { type: integer, nullable: true, example: 1 }
        total: { type: integer, example: 1 }

    DetalleMantenimientoStoreRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /ordenes-trabajo/{orden}/detalles`. `id_orden_trabajo` se toma
        de la URL y no debe enviarse.
      required: [id_tipo_mantenimiento, fecha, cantidad]
      properties:
        id_tipo_mantenimiento:
          type: integer
          description: Debe existir en el catálogo `tipo_mantenimiento` y ser de ámbito `taller` (ver `GET /parametros/colecciones` → `ordenes_trabajo.tipos_mantenimiento`).
          example: 3
        id_repuesto:
          type: integer
          nullable: true
          description: Opcional. Debe existir en `repuesto` (ver `GET /parametros/colecciones` → `ordenes_trabajo.repuestos`). Se omite cuando el ítem es sólo mano de obra.
          example: 8
        fecha:
          type: string
          format: date
          example: "2026-08-27"
        horometro:
          type: number
          nullable: true
          minimum: 0
          description: "**Obligatorio si el vehículo de la orden mide por horómetro**; ignorado en caso contrario."
          example: null
        kilometraje:
          type: number
          nullable: true
          minimum: 0
          description: "**Obligatorio si el vehículo de la orden mide por kilometraje**; ignorado en caso contrario."
          example: 85230.5
        cantidad:
          type: integer
          minimum: 1
          example: 2

    DetalleMantenimientoStoreResponse:
      type: object
      properties:
        message: { type: string, example: Detalle de mantenimiento registrado exitosamente. }
        data: { $ref: '#/components/schemas/DetalleMantenimiento' }

    OrdenTrabajoCulminarRequest:
      type: object
      description: |
        Cuerpo esperado por `POST /ordenes-trabajo/{orden}/culminar`. `fecha_ejecucion`,
        `fecha_culminacion` y `estado_orden` se fijan en el servidor y no deben enviarse.
      properties:
        kilometraje_actual:
          type: integer
          nullable: true
          minimum: 0
          description: "Lectura final del odómetro. **Obligatoria si el vehículo de la orden mide por kilometraje.**"
          example: 85300
        horometro_actual:
          type: integer
          nullable: true
          minimum: 0
          description: "Lectura final del horómetro. **Obligatoria si el vehículo de la orden mide por horómetro.**"
          example: null
        observacion:
          type: string
          nullable: true
          maxLength: 500
          example: Se cambió aceite y filtros. Todo en orden.

    Notificacion:
      type: object
      description: |
        Notificación ya formateada para el consumo de la API a partir de la tabla
        `notifications` (`data.tipo` determina `titulo`/`descripcion`/`icono`).
      properties:
        id: { type: string, format: uuid, example: "9d1f7e2a-6b3c-4e10-9a3d-2f6b6c1e5a90" }
        tipo: { type: string, example: observacion_operacion }
        titulo: { type: string, example: Observación en operación diaria }
        descripcion: { type: string, example: Falta revisar presión de llantas }
        icono: { type: string, example: ri-error-warning-line }
        url:
          type: string
          nullable: true
          example: "http://localhost/operacion-diaria/12"
        leida: { type: boolean, example: false }
        fecha:
          type: string
          format: date-time
          description: Fecha de creación en formato ISO-8601.
          example: "2026-08-17T14:30:00+00:00"
        fecha_legible: { type: string, example: hace 1 día }

    NotificacionMarcarLeidaResponse:
      type: object
      properties:
        message: { type: string, example: Notificación marcada como leída. }
        data: { $ref: '#/components/schemas/Notificacion' }
